<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>ターゲットショット</title><style>body{margin:0;background:#04070e;color:#fff;font-family:system-ui;text-align:center}.arena{position:relative;width:min(94vw,430px);height:58vh;min-height:430px;margin:15px auto;background:#101827;border:1px solid #334155;border-radius:18px;overflow:hidden;touch-action:manipulation}.target{position:absolute;width:52px;height:52px;border-radius:50%;background:#ef4444;box-shadow:0 0 25px #ef4444;border:5px solid #fff}.info{font-weight:800;color:#cbd5e1}.back{padding:11px 18px;border-radius:12px;background:#111827;border:1px solid #33415c;color:#fff;font-weight:800}</style><h1>🎯 ターゲットショット</h1><div class="info" id="i">30秒で何個当てられる？</div><div class="arena" id="a"></div><button class="back" onclick="location.href='index.html'">← ゲーム王国</button><script>let a=document.getElementById("a"),i=document.getElementById("i"),score=0,end=Date.now()+30000,t;function spawn(){if(Date.now()>=end){i.textContent="終了！ "+score+"発";return}if(t)t.remove();t=document.createElement("button");t.className="target";t.style.left=Math.random()*(a.clientWidth-60)+"px";t.style.top=Math.random()*(a.clientHeight-60)+"px";t.onclick=()=>{score++;navigator.vibrate?.(10);spawn()};a.appendChild(t);i.textContent="残り "+Math.ceil((end-Date.now())/1000)+"秒　"+score+"発"}spawn();setInterval(()=>{if(Date.now()<end)i.textContent="残り "+Math.ceil((end-Date.now())/1000)+"秒　"+score+"発"},500)</script></html>
