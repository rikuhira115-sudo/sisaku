<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080d18"><title>ナンプレ | ゲーム王国</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#20365c,#080d18 55%,#03050a);color:#f8fafc;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:12px 10px 32px}
header{text-align:center;padding:8px 0 12px}h1{font-size:clamp(1.6rem,7vw,2.2rem);margin:0 0 4px;letter-spacing:.06em}header p{color:#9eabc2;font-size:.85rem;margin:0}
.wrap{max-width:520px;margin:auto}.top{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:4px 0 10px;flex-wrap:wrap}.pill{border:1px solid #34415a;background:#101827;border-radius:10px;padding:8px 11px;color:#dbeafe;font-weight:800;font-size:.85rem}
select,button{font:inherit}select{background:#101827;color:white;border:1px solid #34415a;border-radius:10px;padding:8px;max-width:140px}
.board{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));aspect-ratio:1;width:100%;border:2px solid #9ab6e8;border-radius:5px;overflow:hidden;background:#0b1220;box-shadow:0 12px 35px #0007;touch-action:manipulation}
.cell{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;aspect-ratio:1;border:0;border-right:1px solid #35445d;border-bottom:1px solid #35445d;background:#101827;color:#dbeafe;font-size:clamp(1rem,5.3vw,1.65rem);font-weight:650;padding:0;cursor:pointer}
.cell:nth-child(3n){border-right:2px solid #9ab6e8}.cell:nth-child(9n){border-right:0}.cell:nth-child(n+19):nth-child(-n+27),.cell:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid #9ab6e8}.cell:nth-child(n+73){border-bottom:0}
.cell.given{color:#f8fafc;font-weight:900;background:#172338}.cell.selected{background:#2456a5!important;box-shadow:inset 0 0 0 2px #93c5fd}.cell.related{background:#192a43}.cell.same{background:#24456a;color:#fff}.cell.error{color:#fca5a5;background:#4a202b}.cell .notes{position:absolute;inset:2px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);font-size:clamp(.38rem,1.8vw,.62rem);font-weight:500;color:#8da7ce;line-height:1;pointer-events:none}
.status{display:flex;justify-content:space-between;gap:8px;color:#9eabc2;font-size:.8rem;margin:10px 2px}.status strong{color:#e2e8f0}
.pad{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:5px;margin-top:12px}.num{min-width:0;padding:11px 0;border:1px solid #3c5274;background:linear-gradient(#1b2b45,#101827);color:#f8fafc;border-radius:10px;font-size:1.15rem;font-weight:900;touch-action:manipulation}.num:active,.action:active{transform:scale(.96)}.num:disabled{opacity:.25}
.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:10px}.action{padding:10px 5px;border:1px solid #34415a;border-radius:10px;background:#111827;color:#dbeafe;font-size:.83rem;font-weight:800;touch-action:manipulation}.action.primary{background:#2563eb;border-color:#60a5fa;color:white}.action.active{background:#7c3aed;border-color:#c4b5fd}
.message{min-height:26px;text-align:center;color:#93c5fd;font-size:.9rem;font-weight:800;margin:10px 0 0}.help{color:#94a3b8;font-size:.78rem;line-height:1.6;text-align:center;margin:8px 0 0}
@media(min-width:500px){body{padding-top:18px}.cell{font-size:1.55rem}.num{padding:12px 0}}
</style></head><body><header><h1>🔢 ナンプレ</h1><p>数字を埋めて、9×9の盤面を完成させよう！</p></header>
<main class="wrap"><div class="top"><select id="difficulty" aria-label="難易度"><option value="easy">初級</option><option value="medium" selected>中級</option><option value="hard">上級</option></select><div class="pill">⏱ <span id="time">00:00</span></div><div class="pill">ミス <span id="mistakes">0</span>/3</div></div>
<div id="board" class="board" role="grid" aria-label="ナンプレ盤面"></div><div class="status"><span>入力済み <strong id="filled">0</strong>/81</span><span id="modeLabel">通常入力</span></div>
<div id="pad" class="pad" aria-label="数字入力"></div><div class="actions"><button id="notesBtn" class="action">✎ メモ OFF</button><button id="hintBtn" class="action">💡 ヒント</button><button id="checkBtn" class="action">✓ チェック</button><button id="eraseBtn" class="action">⌫ 消去</button><button id="newBtn" class="action primary">新しい問題</button><button id="rulesBtn" class="action">遊び方</button></div><div id="message" class="message" role="status">マスを選んで数字を入力！</div><p class="help">スマホはマスをタップして、下の数字ボタンで入力できます。メモ機能で候補数字も記録できます。</p></main>
<script src="common.js"></script><script>
(()=>{'use strict';
const $=id=>document.getElementById(id),boardEl=$('board'),padEl=$('pad');
let puzzle=[],solution=[],values=[],notes=[],selected=-1,notesMode=false,mistakes=0,seconds=0,finished=false,timer=null;
const digits=[1,2,3,4,5,6,7,8,9];
function shuffled(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function canPlace(g,r,c,n){for(let i=0;i<9;i++)if(g[r*9+i]===n||g[i*9+c]===n)return false;let br=Math.floor(r/3)*3,bc=Math.floor(c/3)*3;for(let y=0;y<3;y++)for(let x=0;x<3;x++)if(g[(br+y)*9+bc+x]===n)return false;return true}
function fillGrid(g,pos=0){if(pos===81)return true;let r=Math.floor(pos/9),c=pos%9;if(g[pos])return fillGrid(g,pos+1);for(const n of shuffled(digits.slice()))if(canPlace(g,r,c,n)){g[pos]=n;if(fillGrid(g,pos+1))return true;g[pos]=0}return false}
function generate(){let g=Array(81).fill(0);fillGrid(g);solution=g.slice();puzzle=g.slice();let remove=$('difficulty').value==='easy'?36:$('difficulty').value==='hard'?52:45;for(const i of shuffled([...Array(81).keys()]).slice(0,remove))puzzle[i]=0;values=puzzle.slice();notes=Array.from({length:81},()=>new Set());selected=-1;mistakes=0;seconds=0;finished=false;notesMode=false;$('notesBtn').classList.remove('active');$('notesBtn').textContent='✎ メモ OFF';$('modeLabel').textContent='通常入力';$('message').textContent='マスを選んで数字を入力！';if(timer)clearInterval(timer);timer=setInterval(()=>{if(!finished){seconds++;$('time').textContent=fmt(seconds)}},1000);render()}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function render(){boardEl.innerHTML='';for(let i=0;i<81;i++){let b=document.createElement('button');b.className='cell';b.type='button';b.setAttribute('role','gridcell');b.setAttribute('aria-label',Math.floor(i/9)+1+'行 '+(i%9+1)+'列 '+(values[i]||'空欄'));if(puzzle[i])b.classList.add('given');if(selected>=0){if(i===selected)b.classList.add('selected');else if(Math.floor(i/9)===Math.floor(selected/9)||i%9===selected%9||(Math.floor(i/27)===Math.floor(selected/27)&&Math.floor(i%9/3)===Math.floor(selected%9/3)))b.classList.add('related');if(values[i]&&values[i]===values[selected])b.classList.add('same')}if(values[i]){b.textContent=values[i];if(!puzzle[i]&&values[i]!==solution[i])b.classList.add('error')}else if(notes[i].size){let n=document.createElement('span');n.className='notes';for(let d=1;d<=9;d++){let s=document.createElement('span');s.textContent=notes[i].has(d)?d:'';n.appendChild(s)}b.appendChild(n)}b.onclick=()=>{selected=i;render()};boardEl.appendChild(b)}$('filled').textContent=values.filter(Boolean).length;$('mistakes').textContent=mistakes;padEl.innerHTML='';for(let n=1;n<=9;n++){let b=document.createElement('button');b.className='num';b.textContent=n;b.type='button';b.disabled=finished||values.filter(v=>v===n).length>=9;b.onclick=()=>input(n);padEl.appendChild(b)}}
function input(n){if(finished||selected<0){$('message').textContent='先に数字を入れるマスを選んでね';return}if(puzzle[selected]){$('message').textContent='最初からある数字は変更できません';return}if(notesMode){if(notes[selected].has(n))notes[selected].delete(n);else notes[selected].add(n);$('message').textContent='候補メモを更新しました';render();return}if(values[selected]===n){return}values[selected]=n;notes[selected].clear();if(n!==solution[selected]){mistakes++;$('message').textContent='数字が違うみたい。盤面を確認してみよう';if(mistakes>=3)$('message').textContent='ミスが3回になりました。続けて挑戦できます！'}else{$('message').textContent='いい感じ！'}if(values.every((v,i)=>v===solution[i])){finished=true;clearInterval(timer);$('message').textContent='🎉 クリア！ タイム '+fmt(seconds);if(window.GameKit)GameKit.finish('ナンプレクリア！ タイム '+fmt(seconds))}render()}
$('notesBtn').onclick=()=>{notesMode=!notesMode;$('notesBtn').classList.toggle('active',notesMode);$('notesBtn').textContent=notesMode?'✎ メモ ON':'✎ メモ OFF';$('modeLabel').textContent=notesMode?'候補メモ入力':'通常入力'};
$('hintBtn').onclick=()=>{if(finished)return;if(selected<0){$('message').textContent='まずマスを選んでね';return}if(puzzle[selected]){$('message').textContent='空いているマスを選んでね';return}values[selected]=solution[selected];notes[selected].clear();$('message').textContent='💡 ヒントを使いました！';if(values.every((v,i)=>v===solution[i])){finished=true;clearInterval(timer);$('message').textContent='🎉 クリア！ タイム '+fmt(seconds)}render()};
$('checkBtn').onclick=()=>{if(finished)return;let wrong=values.some((v,i)=>v&&v!==solution[i]);$('message').textContent=wrong?'赤い数字を見直してみよう！':'入力した数字はすべて正解です！';render()};
$('eraseBtn').onclick=()=>{if(selected<0||puzzle[selected]||finished)return;values[selected]=0;notes[selected].clear();$('message').textContent='マスを消去しました';render()};
$('newBtn').onclick=generate;$('difficulty').onchange=generate;
$('rulesBtn').onclick=()=>{if(window.GameKit)GameKit.openHow();else alert('各行・各列・各3×3ブロックに1〜9を1回ずつ入れます。マスを選び、数字を入力してください。')};
document.addEventListener('keydown',e=>{if(e.key>='1'&&e.key<='9')input(Number(e.key));else if(e.key==='Backspace'||e.key==='Delete')$('eraseBtn').click();else if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();if(selected<0)selected=0;else selected=Math.max(0,Math.min(80,selected+({ArrowUp:-9,ArrowDown:9,ArrowLeft:-1,ArrowRight:1}[e.key])));render()}});
if(window.GameKit)GameKit.mount({howto:'各行・各列・各3×3ブロックに、1〜9を重複しないように入れるパズルです。マスを選択して数字ボタン、またはキーボードの数字で入力。メモで候補を書き留め、ヒントやチェックも使えます。'});
generate();
})();
</script></body></html>
