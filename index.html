<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05070c"><title>ゲーム王国</title><style>*{box-sizing:border-box}body{margin:0;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 50% -10%,#1c3158,#070a11 42%,#000 78%);min-height:100vh}header{padding:28px 18px 18px;text-align:center}.crown{font-size:3rem}h1{font-size:clamp(2.1rem,9vw,3.4rem);margin:2px 0 4px;letter-spacing:.08em}header p{margin:0;color:#9eabc2}.toolbar{max-width:720px;margin:10px auto 0;padding:0 16px;display:flex;gap:8px;overflow:auto}.filter{white-space:nowrap;border:1px solid #303c54;background:#111827;color:#cbd5e1;border-radius:999px;padding:9px 15px;font-weight:700}.filter.active{background:#2b6cff;color:#fff}.main{max-width:900px;margin:auto;padding:12px 16px 40px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{position:relative;border:1px solid #263248;border-radius:18px;background:linear-gradient(145deg,#111827,#090d15);padding:16px;min-height:132px;cursor:pointer;transition:.18s;box-shadow:0 8px 24px #0005}.card:active{transform:scale(.97)}.icon{font-size:2.5rem}.name{font-size:1.08rem;font-weight:800;margin-top:8px}.desc{font-size:.78rem;color:#8996aa;margin-top:4px}.badge{position:absolute;right:10px;top:10px;font-size:.68rem;padding:5px 8px;border-radius:999px;background:#263d75;color:#bcd2ff}.section h2{font-size:1.15rem;color:#8db5ff;margin:20px 0 12px}@media(min-width:650px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}</style></head><body><header><div class="crown">👑</div><h1>ゲーム王国</h1><p>すぐ遊べる、ちょっとハマる。</p></header><nav class="toolbar"><button class="filter active" data-f="all">全部</button><button class="filter" data-f="solo">1人用</button><button class="filter" data-f="battle">対戦</button><button class="filter" data-f="new">新作</button></nav><main class="main"><section class="section"><h2>⚡ ゲーム一覧</h2><div class="grid" id="games"></div></section></main><script>
const games=[["🔥","連打王","5秒間ひたすら連打！","taprush.html","solo","new"],["☄️","隕石よけ","迫る隕石を左右移動で回避！","meteor.html","solo","new"],["🔨","モグラたたき","出てきたモグラを素早くタップ！","whack.html","solo","new"],["🧮","計算ラッシュ","30秒で計算問題を解きまくれ！","quickmath.html","solo","new"],["🧠","記憶シーケンス","光った順番を覚えよう","memoryseq.html","solo","new"],["🔼","ハイ＆ロー","次は大きい？小さい？","higherlower.html","solo","new"],["💣","ミニマイン","地雷を避けて全マス制覇！","mines.html","solo","new"],["🧱","ブリックブレイク","ボールでブロックを全部壊せ！","brick.html","solo","new"],["🎯","ターゲットショット","動くターゲットを狙い撃ち！","target.html","solo","new"],["🎵","リズムタップ","ノートのタイミングを狙え！","rhythm.html","solo","new"],["⚡","反射神経","光った瞬間にタップ！","reaction.html","solo","new"],["⏱️","10秒チャレンジ","10.00秒を狙え。","tenseconds.html","solo","new"],["🎨","カラータップ","色を見抜いて連続正解！","colortap.html","solo","new"],["🐍","スネーク","リンゴを食べてハイスコア！","snake.html","solo",""],["🟦","Block Blast","ブロックを置いてラインを消そう","blockblast.html","solo",""],["🔢","2024 パズル","数字を合体させよう","2024.html","solo",""],["⭕","5目並べ","先に5つ並べたら勝ち","gomoku.html","battle",""],["⚫","オセロ","置ける場所を見極めよう","othello.html","battle",""],["🃏","神経衰弱","記憶力で勝負！","memory.html","battle",""],["♟️","ミニ将棋","5×5の将棋","mini_shogi.html","battle",""],["🔳","ドット＆ボックス","最後の一手を見極めろ","dots.html","battle",""]];const box=document.getElementById("games");function render(f="all"){box.innerHTML="";games.filter(g=>f==="all"||g[4]===f||g[5]===f).forEach(g=>{let d=document.createElement("div");d.className="card";d.innerHTML='<span class="icon">'+g[0]+'</span><div class="name">'+g[1]+'</div><div class="desc">'+g[2]+'</div>'+(g[5]==="new"?'<span class="badge">NEW</span>':"");d.onclick=()=>location.href=g[3];box.appendChild(d)})}document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));b.classList.add("active");render(b.dataset.f)});render();</script></body></html>
