<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>五目並べ - ゲーム王国</title><style>body{margin:0;background:#05070c;color:#fff;font-family:system-ui;text-align:center;overflow-x:hidden}h1{margin:18px 0 4px}.info{color:#94a3b8;font-weight:800;min-height:28px}.board{width:min(94vw,620px);aspect-ratio:1;margin:12px auto;border-radius:16px;background:#d6a34a;border:5px solid #5a3a14;box-shadow:inset 0 0 0 2px #f3c56c,0 10px 30px #0008;touch-action:none}.board canvas{width:100%;height:100%;display:block;border-radius:10px;touch-action:none}.score{font-weight:800;color:#cbd5e1}</style></head><body><h1>⭕ 五目並べ</h1><div id="info" class="info">黒からスタート</div><div class="score">15×15・先に5つ並べたら勝ち</div><div class="board"><canvas id="cv" width="600" height="600"></canvas></div><script src="common.js"></script><script>const cv=document.getElementById("cv"),ctx=cv.getContext("2d"),info=document.getElementById("info"),N=15,pad=30,gap=(600-pad*2)/(N-1);let b=[],turn=1,over=false,last=null,win=[];function reset(){b=Array.from({length:N},()=>Array(N).fill(0));turn=1;over=false;last=null;win=[];info.textContent="黒の番";draw()}function start(){reset()}function pos(e){let r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*600/r.width,y=(e.clientY-r.top)*600/r.height;return [Math.max(0,Math.min(N-1,Math.round((x-pad)/gap))),Math.max(0,Math.min(N-1,Math.round((y-pad)/gap)))]}cv.addEventListener("pointerdown",e=>{if(over)return;let[x,y]=pos(e);if(b[y][x])return;b[y][x]=turn;last=[x,y];let w=getWin(x,y);if(w.length){win=w;over=true;info.textContent=(turn===1?"黒":"白")+"の勝ち！";navigator.vibrate?.([40,50,100]);draw();return}turn=3-turn;info.textContent=(turn===1?"黒":"白")+"の番";draw()});function getWin(x,y){let out=[];for(const[dX,dY]of[[1,0],[0,1],[1,1],[1,-1]]){let line=[[x,y]],nx=x+dX,ny=y+dY;while(nx>=0&&nx<N&&ny>=0&&ny<N&&b[ny][nx]===turn){line.push([nx,ny]);nx+=dX;ny+=dY}nx=x-dX;ny=y-dY;while(nx>=0&&nx<N&&ny>=0&&ny<N&&b[ny][nx]===turn){line.push([nx,ny]);nx-=dX;ny-=dY}if(line.length>=5)return line}return out}function draw(){ctx.clearRect(0,0,600,600);ctx.fillStyle="#d6a34a";ctx.fillRect(0,0,600,600);ctx.strokeStyle="#5b3b18";ctx.lineWidth=2;for(let i=0;i<N;i++){let p=pad+i*gap;ctx.beginPath();ctx.moveTo(p,pad);ctx.lineTo(p,600-pad);ctx.stroke();ctx.beginPath();ctx.moveTo(pad,p);ctx.lineTo(600-pad,p);ctx.stroke()}for(const[x,y]of[[3,3],[3,11],[7,7],[11,3],[11,11]]){ctx.fillStyle="#4b3015";ctx.beginPath();ctx.arc(pad+x*gap,pad+y*gap,5,0,7);ctx.fill()}for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(b[y][x]){ctx.fillStyle=b[y][x]===1?"#111":"#f8fafc";ctx.beginPath();ctx.arc(pad+x*gap,pad+y*gap,18,0,7);ctx.fill();ctx.strokeStyle=b[y][x]===1?"#555":"#888";ctx.lineWidth=1;ctx.stroke()}if(last){ctx.strokeStyle="#22c55e";ctx.lineWidth=4;ctx.strokeRect(pad+last[0]*gap-14,pad+last[1]*gap-14,28,28)}win.forEach(([x,y])=>{ctx.strokeStyle="#ef4444";ctx.lineWidth=5;ctx.beginPath();ctx.arc(pad+x*gap,pad+y*gap,22,0,7);ctx.stroke()})}GameKit.mount({title:"⭕ 五目並べ",intro:"15×15の盤で、先に自分の石を5つ連続で並べた方が勝ちです。",howto:"黒→白の順に1つずつ石を置きます。横・縦・斜めのどれかに自分の石が5つ以上連続すれば勝利です。タップした場所に最も近い交点へ石が置かれ、最後の着手には緑の枠が付きます。",onStart:start,onRestart:start});reset()</script></body></html>
