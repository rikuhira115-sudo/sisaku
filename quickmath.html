<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>計算ラッシュ</title><style>body{margin:0;background:#05070c;color:#fff;font-family:system-ui;text-align:center}h1{margin:22px 0 6px}.info{color:#94a3b8;font-weight:800}.q{font-size:clamp(2.3rem,11vw,4rem);font-weight:900;margin:55px 0 35px}.ans{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(92vw,440px);margin:auto}.ans button{min-height:72px;padding:16px;border-radius:16px;border:1px solid #33415c;background:#111827;color:#fff;font-size:1.5rem;font-weight:900;touch-action:manipulation}.ans button:active{transform:scale(.96)}.correct{background:#166534!important}.wrong{background:#991b1b!important}</style><body><h1>🧮 計算ラッシュ</h1><div id="info" class="info">30秒で何問解ける？</div><div id="q" class="q">---</div><div id="a" class="ans"></div><script src="common.js"></script><script>const q=document.getElementById("q"),a=document.getElementById("a"),info=document.getElementById("info");let score=0,end=0,iv=0,busy=false;function reset(){clearInterval(iv);score=0;end=0;busy=false;q.textContent="---";a.innerHTML="";info.textContent="30秒で何問解ける？"}function start(){score=0;end=Date.now()+30000;busy=true;next();clearInterval(iv);iv=setInterval(()=>{const left=Math.max(0,end-Date.now());info.textContent="残り "+Math.ceil(left/1000)+"秒　正解 "+score;if(left<=0){busy=false;clearInterval(iv);q.textContent="終了！ "+score+"問正解";a.innerHTML=""}},200)}function next(){if(!busy)return;let x=3+Math.floor(Math.random()*13),y=3+Math.floor(Math.random()*13),type=Math.random()<.25?"×":"+";let ans=type==="+"?x+y:x*y;q.textContent=x+" "+type+" "+y+" = ?";let opts=[ans];while(opts.length<4){let n=ans+(Math.floor(Math.random()*9)-4);if(n>0&&!opts.includes(n))opts.push(n)}opts.sort(()=>Math.random()-.5);a.innerHTML="";opts.forEach(n=>{let b=document.createElement("button");b.textContent=n;b.onclick=()=>{if(!busy)return;if(n===ans){score++;b.classList.add("correct")}else b.classList.add("wrong");setTimeout(next,100)};a.appendChild(b)})}GameKit.mount({title:"🧮 計算ラッシュ",intro:"30秒間、暗算でどんどん答えよう。",howto:"問題に対する答えを4つのボタンから選びます。正解するたびに次の問題へ進みます。まずは正確さ、慣れたらスピード勝負！",onStart:start,onRestart:reset});</script></body></html>
