<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>計算ラッシュ</title><style>body{margin:0;background:#05070c;color:#fff;font-family:system-ui;text-align:center}h1{margin:25px}.q{font-size:3rem;font-weight:900;margin:55px 0 30px}.ans{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(92vw,420px);margin:auto}.ans button{padding:20px;border-radius:16px;border:1px solid #33415c;background:#111827;color:#fff;font-size:1.5rem;font-weight:900}.info{color:#94a3b8}.back{margin:24px;padding:11px 18px;border-radius:12px;border:1px solid #33415c;background:#111827;color:#fff}</style><h1>🧮 計算ラッシュ</h1><div class="info" id="info">30秒で何問解ける？</div><div class="q" id="q"></div><div class="ans" id="a"></div><button class="back" onclick="location.href='index.html'">← ゲーム王国</button><script>let q=document.getElementById("q"),a=document.getElementById("a"),i=document.getElementById("info"),score=0,end=Date.now()+30000,ok=0;function next(){if(Date.now()>=end){q.textContent="終了！";a.innerHTML="";i.textContent=score+"問正解";return}let x=Math.floor(Math.random()*12)+3,y=Math.floor(Math.random()*12)+3,ans=x+y;q.textContent=x+" + "+y+" = ?";let opts=[ans];while(opts.length<4){let n=ans+Math.floor(Math.random()*11)-5;if(n>0&&!opts.includes(n))opts.push(n)}opts.sort(()=>Math.random()-.5);a.innerHTML="";opts.forEach(n=>{let b=document.createElement("button");b.textContent=n;b.onclick=()=>{if(n===ans)score++;next()};a.appendChild(b)});i.textContent="残り "+Math.ceil((end-Date.now())/1000)+"秒　正解 "+score}next();setInterval(()=>{if(Date.now()<end)i.textContent="残り "+Math.ceil((end-Date.now())/1000)+"秒　正解 "+score},250)</script></html>
