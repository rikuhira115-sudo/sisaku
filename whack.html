<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>モグラたたき</title><style>body{margin:0;background:#080a0f;color:#fff;font-family:system-ui;text-align:center}h1{margin:22px 0 6px}.info{font-size:1.2rem;font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:min(92vw,420px);margin:25px auto}.hole{aspect-ratio:1;border:0;border-radius:50%;background:#1e293b;box-shadow:inset 0 -10px 0 #0f172a}.mole{background:#f59e0b;box-shadow:0 0 25px #f59e0b}.btn{padding:11px 18px;border-radius:12px;border:1px solid #33415c;background:#111827;color:#fff;font-weight:800}</style><h1>🔨 モグラたたき</h1><div class="info" id="i">30秒で何匹倒せる？</div><div class="grid" id="g"></div><button class="btn" onclick="location.href='index.html'">← ゲーム王国</button><script>let g=document.getElementById("g"),i=document.getElementById("i"),a=[...Array(9)],score=0,st=Date.now(),active=-1;for(let n=0;n<9;n++){let b=document.createElement("button");b.className="hole";b.onclick=()=>{if(n===active){score++;active=-1;b.className="hole";navigator.vibrate?.(15)}};g.appendChild(b)}function tick(){let left=30000-(Date.now()-st);if(left<=0){i.textContent="終了！ "+score+"匹";return}i.textContent="残り "+Math.ceil(left/1000)+"秒　"+score+"匹";if(active<0){active=Math.floor(Math.random()*9);g.children[active].className="hole mole";setTimeout(()=>{if(active>=0){g.children[active].className="hole";active=-1}},650)}setTimeout(tick,120)}tick()</script></html>
