<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>ミニマイン</title><style>body{margin:0;background:#05070c;color:#fff;font-family:system-ui;text-align:center}h1{margin:20px 0 6px}.info{color:#94a3b8;font-weight:800;min-height:28px}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;width:min(94vw,420px);margin:18px auto}.cell{aspect-ratio:1;border:0;border-radius:7px;background:#1e293b;color:#fff;font-size:clamp(.75rem,4vw,1rem);font-weight:900;touch-action:manipulation}.open{background:#334155}.mine{background:#ef4444}.flag{background:#7c3aed}.mode{padding:9px 14px;border-radius:11px;border:1px solid #33415c;background:#111827;color:#fff;font-weight:800}.mode.on{background:#6d28d9}</style></head><body><h1>💣 ミニマイン</h1><div id="info" class="info">最初のマスは必ず安全！</div><button id="flagMode" class="mode">🚩 旗モード OFF</button><div id="grid" class="grid"></div><script src="common.js"></script><script>const N=49,W=7,grid=document.getElementById("grid"),info=document.getElementById("info"),flagBtn=document.getElementById("flagMode");let mines=new Set(),open=new Set(),flags=new Set(),started=false,over=false,flagMode=false;function reset(){mines=new Set();open=new Set();flags=new Set();started=false;over=false;flagMode=false;flagBtn.classList.remove("on");flagBtn.textContent="🚩 旗モード OFF";render();info.textContent="最初のマスは必ず安全！"}function placeMines(first){while(mines.size<7){let n=Math.floor(Math.random()*N);if(n!==first)mines.add(n)}}function count(n){let r=Math.floor(n/W),c=n%W,k=0;for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;let rr=r+dr,cc=c+dc;if(rr>=0&&rr<W&&cc>=0&&cc<W&&mines.has(rr*W+cc))k++}return k}function reveal(n){if(open.has(n)||flags.has(n)||over)return;if(!started){started=true;placeMines(n)}if(mines.has(n)){over=true;open.add(n);mines.forEach(x=>open.add(x));info.textContent="💥 爆発！ 安全に開けた "+(open.size-mines.size)+" マス";navigator.vibrate?.([90,60,90]);render();return}open.add(n);if(count(n)===0){let r=Math.floor(n/W),c=n%W;for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){let q=(r+dr)*W+c+dc;if(q>=0&&q<N&&Math.abs(q%W-c)<=1)reveal(q)}}if(open.size===N-mines.size){over=true;info.textContent="🎉 完全クリア！";navigator.vibrate?.(40)}else info.textContent="安全 "+open.size+" / "+(N-mines.size);render()}function render(){grid.innerHTML="";for(let n=0;n<N;n++){let b=document.createElement("button");b.className="cell";if(flags.has(n)&&!open.has(n)){b.classList.add("flag");b.textContent="🚩"}else if(open.has(n)){b.classList.add(mines.has(n)?"mine":"open");if(!mines.has(n)){let c=count(n);b.textContent=c||""}else b.textContent="💣"}b.onclick=()=>{if(flagMode){if(!open.has(n)){flags.has(n)?flags.delete(n):flags.add(n);render()}return}reveal(n)};grid.appendChild(b)}}flagBtn.onclick=()=>{flagMode=!flagMode;flagBtn.classList.toggle("on",flagMode);flagBtn.textContent="🚩 旗モード "+(flagMode?"ON":"OFF")};GameKit.mount({title:"💣 ミニマイン",intro:"地雷を踏まずに安全なマスをすべて開こう。",howto:"数字は、そのマスの周囲8マスにある地雷の数です。地雷だと思う場所は「旗モード」で目印を付けられます。最初に開いたマスには地雷がありません。地雷以外を全部開けばクリアです。",onStart:reset,onRestart:reset,startHidden:false});</script></body></html>
