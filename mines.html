<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>ミニマイン</title><style>body{margin:0;background:#05070c;color:#fff;font-family:system-ui;text-align:center}h1{margin:20px}.info{color:#94a3b8}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;width:min(94vw,420px);margin:20px auto}.c{aspect-ratio:1;border:0;border-radius:6px;background:#1e293b;color:#fff;font-weight:900}.open{background:#334155}.mine{background:#ef4444}.back{padding:11px 18px;border-radius:12px;border:1px solid #33415c;background:#111827;color:#fff}</style><h1>💣 ミニマイン</h1><div class="info" id="i">安全なマスを開こう</div><div class="grid" id="g"></div><button class="back" onclick="location.href='index.html'">← ゲーム王国</button><script>const N=49,M=7,mines=new Set();while(mines.size<7)mines.add(Math.floor(Math.random()*N));let g=document.getElementById("g"),i=document.getElementById("i"),open=0;for(let n=0;n<N;n++){let b=document.createElement("button");b.className="c";b.onclick=()=>{if(b.classList.contains("open"))return;if(mines.has(n)){b.className="c mine";b.textContent="💣";i.textContent="爆発！  "+open+"マス安全だった";g.querySelectorAll("button").forEach((x,k)=>{if(mines.has(k)){x.className="c mine";x.textContent="💣"}});return}open++;let r=Math.floor(n/7),c=n%7,cnt=0;for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){let q=(r+dr)*7+c+dc;if(q>=0&&q<N&&Math.abs((q%7)-c)<=1&&mines.has(q))cnt++}b.className="c open";b.textContent=cnt||"";i.textContent="安全 "+open+" / 42";if(open===42)i.textContent="🎉 完全クリア！"};g.appendChild(b)}</script></html>
