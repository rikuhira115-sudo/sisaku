<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>連打王</title><style>body{margin:0;background:#05070c;color:#fff;font-family:system-ui;text-align:center}h1{margin:28px 0 5px}.count{font-size:5rem;font-weight:900;margin:45px 0 10px}.sub{color:#94a3b8}.tap{width:210px;height:210px;border-radius:50%;border:0;background:#f97316;color:#fff;font-size:2rem;font-weight:900;box-shadow:0 12px 35px #0008;touch-action:manipulation}.tap:active{transform:scale(.94)}.back{margin:28px;padding:11px 18px;border-radius:12px;background:#111827;border:1px solid #33415c;color:#fff;font-weight:800}</style><h1>🔥 連打王</h1><div class="sub" id="s">5秒間で何回押せる？</div><div class="count" id="c">0</div><button class="tap" id="b">START</button><br><button class="back" onclick="location.href='index.html'">← ゲーム王国</button><script>let b=document.getElementById("b"),c=document.getElementById("c"),s=document.getElementById("s"),n=0,end=0,run=false;function loop(){if(!run)return;if(Date.now()>=end){run=false;b.textContent="もう一度";s.textContent=n+"回！";return}requestAnimationFrame(loop)}b.onclick=()=>{if(!run&&b.textContent==="START"){run=true;n=0;c.textContent=0;end=Date.now()+5000;b.textContent="TAP!";s.textContent="いけいけ！";loop();return}if(run){n++;c.textContent=n}else{run=true;n=1;c.textContent=1;end=Date.now()+5000;b.textContent="TAP!";s.textContent="いけいけ！";loop()}};</script></html>
