<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>ドット＆ボックス - ゲーム王国</title><style>body{margin:0;background:#05070c;color:#fff;font-family:system-ui;text-align:center;overflow-x:auto}h1{margin:18px 0 4px}.info{min-height:26px;font-weight:800}.score{color:#cbd5e1;font-weight:900}.size{margin:6px}.size button{padding:8px 12px;border:1px solid #33415c;background:#111827;color:#fff;border-radius:10px;font-weight:800}.size .on{background:#2563eb}.board{display:grid;margin:16px auto;background:#111827;padding:8px;border-radius:16px;width:min(94vw,560px);aspect-ratio:1;gap:3px}.dot{background:#e2e8f0;border-radius:50%}.line{border:0;border-radius:8px;background:#273449;touch-action:manipulation}.line:hover,.line:active{background:#475569}.h{min-height:14px}.v{min-width:14px}.p1{background:#38bdf8}.p2{background:#fb7185}.box1{background:#38bdf855;border-radius:6px}.box2{background:#fb718555;border-radius:6px}</style></head><body><h1>🔳 ドット＆ボックス</h1><div id="info" class="info">Player1（青）の番</div><div id="score" class="score">青 0　|　赤 0</div><div class="size"><button class="on" data-s="4">4×4</button><button data-s="5">5×5</button></div><div id="board" class="board"></div><script src="common.js"></script><script>let S=4,cur=1,h=[],v=[],box=[],s1=0,s2=0,over=false;const el=document.getElementById("board"),info=document.getElementById("info"),score=document.getElementById("score");function reset(n=S){S=n;h=Array.from({length:S+1},()=>Array(S).fill(0));v=Array.from({length:S},()=>Array(S+1).fill(0));box=Array.from({length:S},()=>Array(S).fill(0));cur=1;s1=s2=0;over=false;render()}function start(){reset(S)}function render(){el.innerHTML="";el.style.gridTemplateColumns="repeat("+((S*2)+1)+",1fr)";for(let gy=0;gy<2*S+1;gy++)for(let gx=0;gx<2*S+1;gx++){if(gx%2===0&&gy%2===0){let d=document.createElement("div");d.className="dot";el.appendChild(d)}else if(gy%2===0){let x=(gx-1)/2,y=gy/2,b=document.createElement("button");b.className="line h";if(h[y][x])b.classList.add(h[y][x]===1?"p1":"p2");b.disabled=!!h[y][x];b.onclick=()=>lineH(x,y);el.appendChild(b)}else if(gx%2===0){let x=gx/2,y=(gy-1)/2,b=document.createElement("button");b.className="line v";if(v[y][x])b.classList.add(v[y][x]===1?"p1":"p2");b.disabled=!!v[y][x];b.onclick=()=>lineV(x,y);el.appendChild(b)}else{let x=(gx-1)/2,y=(gy-1)/2,d=document.createElement("div");d.className=box[y][x]?"box"+box[y][x]:"";el.appendChild(d)}}info.textContent=over?info.textContent:"Player"+cur+"（"+(cur===1?"青":"赤")+"）の番";score.textContent="青 "+s1+"　|　赤 "+s2}function complete(x,y){return x>=0&&y>=0&&x<S&&y<S&&h[y][x]&&h[y+1][x]&&v[y][x]&&v[y][x+1]}function lineH(x,y){if(over||h[y][x])return;h[y][x]=cur;let g=0;if(y>0&&complete(x,y-1)){box[y-1][x]=cur;g++}if(y<S-1&&complete(x,y)){box[y][x]=cur;g++}if(cur===1)s1+=g;else s2+=g;if(g===0)cur=3-cur;render();check()}function lineV(x,y){if(over||v[y][x])return;v[y][x]=cur;let g=0;if(x>0&&complete(x-1,y)){box[y][x-1]=cur;g++}if(x<S-1&&complete(x,y)){box[y][x]=cur;g++}if(cur===1)s1+=g;else s2+=g;if(g===0)cur=3-cur;render();check()}function check(){if(box.flat().every(Boolean)){over=true;info.textContent=s1>s2?"🏆 Player1（青）の勝ち！":s2>s1?"🏆 Player2（赤）の勝ち！":"引き分け！";render()}}document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-s]").forEach(x=>x.classList.remove("on"));b.classList.add("on");reset(Number(b.dataset.s))});GameKit.mount({title:"🔳 ドット＆ボックス",intro:"線を1本ずつ引いて、四角を完成させよう。完成させた人が得点します。",howto:"Player1（青）からスタート。横線か縦線を1本選びます。四角の4辺がそろった瞬間、その四角を獲得して1点。四角を完成させた場合はもう一度自分の番です。すべての四角が埋まったら得点の多い方が勝ちです。",onStart:start,onRestart:start});reset()</script></body></html>
