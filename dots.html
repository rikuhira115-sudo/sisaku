<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>ドット＆ボックス - ゲーム王国</title><style>
html,body{margin:0;min-height:100%;background:#05070c;color:#fff;font-family:system-ui;text-align:center;overflow-x:hidden}
h1{margin:12px 0 3px;font-size:1.65rem}.info{min-height:23px;font-size:.88rem;font-weight:900}.score{font-size:1rem;font-weight:900;margin:4px}.size{display:flex;justify-content:center;gap:6px;margin:6px}.size button{padding:7px 11px;border:1px solid #33415c;background:#111827;color:#fff;border-radius:10px;font-weight:800}.size .on{background:#2563eb;border-color:#60a5fa}
.boardWrap{width:100%;display:flex;justify-content:center}.board{width:315px;height:315px;position:relative;margin:8px auto;background:#101827;border:2px solid #33415c;border-radius:18px;touch-action:none;box-shadow:0 8px 28px #0007}
canvas{display:block;width:100%;height:100%;touch-action:none}.hint{color:#64748b;font-size:.75rem;margin:5px}
</style></head><body><h1>🔳 ドット＆ボックス</h1><div id="info" class="info">青の番</div><div id="score" class="score">青 0　|　赤 0</div><div class="size"><button data-s="4" class="on">4×4</button><button data-s="5">5×5</button></div><div class="boardWrap"><div class="board"><canvas id="cv" width="680" height="680"></canvas></div></div><div class="hint">太い線をタップして1本引こう。四角を作ったらもう一度！</div><script src="common.js"></script><script>
const cv=document.getElementById("cv"),ctx=cv.getContext("2d"),info=document.getElementById("info"),scoreEl=document.getElementById("score");let S=4,gap=0,p=1,h=[],v=[],boxes=[],over=false;
function reset(n=S){S=n;gap=680/(S-1);h=Array.from({length:S},()=>Array(S-1).fill(0));v=Array.from({length:S-1},()=>Array(S).fill(0));boxes=Array.from({length:S-1},()=>Array(S-1).fill(0));p=1;over=false;draw();update()}
function start(){reset(S)}
function update(){if(over)return;info.textContent=(p===1?"青":"赤")+"の番";scoreEl.textContent="青 "+boxes.flat().filter(x=>x===1).length+"　|　赤 "+boxes.flat().filter(x=>x===2).length}
function complete(x,y){return h[y][x]&&h[y+1][x]&&v[y][x]&&v[y][x+1]}
function addH(x,y){if(over||x<0||x>=S-1||y<0||y>=S||h[y][x])return;h[y][x]=p;let got=0;if(y>0&&complete(x,y-1)){boxes[y-1][x]=p;got++}if(y<S-1&&complete(x,y)){boxes[y][x]=p;got++}if(!got)p=3-p;draw();if(boxes.flat().every(Boolean)){over=true;const a=boxes.flat().filter(x=>x===1).length,b=boxes.flat().filter(x=>x===2).length;info.textContent=a>b?"🏆 青の勝ち！":b>a?"🏆 赤の勝ち！":"引き分け！";draw();return}update()}
function addV(x,y){if(over||x<0||x>=S||y<0||y>=S-1||v[y][x])return;v[y][x]=p;let got=0;if(x>0&&complete(x-1,y)){boxes[y][x-1]=p;got++}if(x<S-1&&complete(x,y)){boxes[y][x]=p;got++}if(!got)p=3-p;draw();if(boxes.flat().every(Boolean)){over=true;const a=boxes.flat().filter(x=>x===1).length,b=boxes.flat().filter(x=>x===2).length;info.textContent=a>b?"🏆 青の勝ち！":b>a?"🏆 赤の勝ち！":"引き分け！";draw();return}update()}
function hit(e){if(over)return;const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*680/r.width,y=(e.clientY-r.top)*680/r.height;let best=null,dist=1e9;
for(let yy=0;yy<S;yy++)for(let xx=0;xx<S-1;xx++){const d=Math.abs(y-yy*gap);const dx=Math.abs(x-(xx+.5)*gap);const q=Math.hypot(dx,d);if(q<dist){dist=q;best=["h",xx,yy]}}
for(let yy=0;yy<S-1;yy++)for(let xx=0;xx<S;xx++){const d=Math.abs(x-xx*gap);const dy=Math.abs(y-(yy+.5)*gap);const q=Math.hypot(dy,d);if(q<dist){dist=q;best=["v",xx,yy]}}
if(dist>82)return;if(best[0]==="h")addH(best[1],best[2]);else addV(best[1],best[2])}
cv.addEventListener("pointerdown",hit);
function draw(){ctx.clearRect(0,0,680,680);ctx.fillStyle="#172033";ctx.fillRect(0,0,680,680);for(let y=0;y<S-1;y++)for(let x=0;x<S-1;x++){if(boxes[y][x]){ctx.fillStyle=boxes[y][x]===1?"rgba(56,189,248,.35)":"rgba(251,113,133,.35)";ctx.fillRect(x*gap+10,y*gap+10,gap-20,gap-20)}}
ctx.lineCap="round";ctx.lineWidth=24;for(let y=0;y<S;y++)for(let x=0;x<S-1;x++)if(h[y][x]){ctx.strokeStyle=h[y][x]===1?"#38bdf8":"#fb7185";ctx.beginPath();ctx.moveTo(x*gap,y*gap);ctx.lineTo((x+1)*gap,y*gap);ctx.stroke()}for(let y=0;y<S-1;y++)for(let x=0;x<S;x++)if(v[y][x]){ctx.strokeStyle=v[y][x]===1?"#38bdf8":"#fb7185";ctx.beginPath();ctx.moveTo(x*gap,y*gap);ctx.lineTo(x*gap,(y+1)*gap);ctx.stroke()}
for(let y=0;y<S;y++)for(let x=0;x<S;x++){ctx.fillStyle="#f8fafc";ctx.beginPath();ctx.arc(x*gap,y*gap,12,0,Math.PI*2);ctx.fill()}}
document.querySelectorAll("[data-s]").forEach(btn=>btn.onclick=()=>{document.querySelectorAll("[data-s]").forEach(x=>x.classList.remove("on"));btn.classList.add("on");reset(Number(btn.dataset.s))});
GameKit.mount({title:"🔳 ドット＆ボックス",intro:"太い線をタップして四角を作る2人対戦です。",howto:"青からスタート。横か縦の線を1本タップして引きます。四角の4辺がそろったらその四角を獲得して1点、さらに続けて自分の番になります。すべての四角が埋まったとき、得点の多い方が勝ちです。",onStart:start,onRestart:start});reset();
</script></body></html>
