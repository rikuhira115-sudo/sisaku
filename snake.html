<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>スネーク - ゲーム王国</title><style>html,body{margin:0;min-height:100%;background:#05070c;color:#fff;font-family:system-ui;text-align:center;overflow-x:hidden}h1{margin:13px 0 3px;font-size:1.7rem}.info{min-height:24px;color:#94a3b8;font-size:.9rem;font-weight:800}.score{font-size:1.15rem;font-weight:900;margin:4px}.wrap{width:min(92vw,390px);margin:8px auto}.wrap canvas{display:block;width:100%;height:auto;aspect-ratio:1;border:2px solid #33415c;border-radius:14px;background:#0b0f16;image-rendering:pixelated;touch-action:none}.hint{font-size:.75rem;color:#64748b;margin-top:6px}</style></head><body><h1>🐍 スネーク</h1><div id="info" class="info">スワイプで曲がる</div><div id="score" class="score">スコア 0</div><div class="wrap"><canvas id="game" width="400" height="400"></canvas></div><div class="hint">スマホ：画面をフリック　PC：矢印キー</div><script src="common.js"></script><script>const cvs=document.getElementById("game"),ctx=cvs.getContext("2d"),info=document.getElementById("info"),scoreEl=document.getElementById("score"),N=20,C=20;let snake=[],dir={x:1,y:0},next={x:1,y:0},apples=[],score=0,running=false,timer=0;function reset(){clearTimeout(timer);snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10},{x:7,y:10}];dir={x:1,y:0};next={x:1,y:0};score=0;apples=[];spawnApples(3);running=false;scoreEl.textContent="スコア 0";info.textContent="スタートで開始";draw()}function freeCell(){const tries=500;for(let i=0;i<tries;i++){const p={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)};if(!snake.some(s=>s.x===p.x&&s.y===p.y)&&!apples.some(a=>a.x===p.x&&a.y===p.y))return p}return null}function spawnApples(n){for(let i=0;i<n;i++){const p=freeCell();if(p)apples.push(p)}}function start(){reset();running=true;info.textContent="りんごを食べよう！";step()}function setDir(d){const map={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};const v=map[d];if(!v||(!running)||((v.x===-dir.x)&&(v.y===-dir.y)))return;next=v}document.addEventListener("keydown",e=>{const d={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right"}[e.key];if(d){e.preventDefault();setDir(d)}});let sx=0,sy=0;cvs.addEventListener("touchstart",e=>{const t=e.changedTouches[0];sx=t.clientX;sy=t.clientY},{passive:true});cvs.addEventListener("touchend",e=>{if(!running)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;if(Math.abs(dx)>Math.abs(dy))setDir(dx>0?"right":"left");else setDir(dy>0?"down":"up")},{passive:true});function step(){if(!running)return;dir=next;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(head.x<0||head.x>=N||head.y<0||head.y>=N)return end("壁にぶつかった！");const eatIndex=apples.findIndex(a=>a.x===head.x&&a.y===head.y),ate=eatIndex>=0;const body=ate?snake:snake.slice(0,-1);if(body.some(s=>s.x===head.x&&s.y===head.y))return end("自分にぶつかった！");snake.unshift(head);if(ate){apples.splice(eatIndex,1);score++;scoreEl.textContent="スコア "+score;navigator.vibrate?.(15);if(snake.length>=N*N){running=false;info.textContent="🎉 盤面制覇！";draw();return}const p=freeCell();if(p)apples.push(p)}else snake.pop();draw();timer=setTimeout(step,Math.max(70,125-score*2))}function end(m){running=false;clearTimeout(timer);info.textContent=m+" スコア "+score;navigator.vibrate?.([60,40,60]);draw()}function draw(){ctx.fillStyle="#0b0f16";ctx.fillRect(0,0,400,400);ctx.strokeStyle="#172033";ctx.lineWidth=1;for(let i=0;i<=N;i++){ctx.beginPath();ctx.moveTo(i*C,0);ctx.lineTo(i*C,400);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*C);ctx.lineTo(400,i*C);ctx.stroke()}apples.forEach(a=>{ctx.fillStyle="#ef4444";ctx.beginPath();ctx.arc(a.x*C+10,a.y*C+10,7,0,Math.PI*2);ctx.fill();ctx.fillStyle="#22c55e";ctx.fillRect(a.x*C+12,a.y*C+2,4,3)});snake.forEach((s,i)=>{ctx.fillStyle=i===0?"#60a5fa":"#2563eb";ctx.fillRect(s.x*C+2,s.y*C+2,16,16)})}GameKit.mount({title:"🐍 スネーク",intro:"りんごを食べながら蛇を伸ばします。スマホはフリック入力、PCは矢印キーです。",howto:"画面上を上下左右にフリックすると蛇が曲がります。PCでは矢印キーを使います。赤いりんごを食べるとスコアが増え、蛇が長くなります。壁や自分の体に当たると終了です。",onStart:start,onRestart:start});start()</script></body></html>
