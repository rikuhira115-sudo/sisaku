<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>スネーク</title><style>body{margin:0;background:#05070c;color:#fff;font-family:system-ui;text-align:center}h1{margin:18px 0 5px}.info{color:#94a3b8;font-weight:800}.score{font-size:1.2rem;font-weight:900;margin:7px}canvas{display:block;width:min(92vw,420px);height:auto;margin:12px auto;border:2px solid #334155;border-radius:14px;background:#0b0f16;image-rendering:pixelated;touch-action:none}.pad{display:grid;grid-template-columns:repeat(3,68px);gap:7px;justify-content:center}.pad button{width:68px;height:52px;border:1px solid #33415c;background:#111827;color:#fff;border-radius:12px;font-size:1.4rem;font-weight:900;touch-action:manipulation}.empty{visibility:hidden}</style></head><body><h1>🐍 スネーク</h1><div id="info" class="info">スワイプまたはボタンで操作</div><div id="score" class="score">スコア 0</div><canvas id="game" width="400" height="400"></canvas><div class="pad"><button class="empty">·</button><button data-d="up">▲</button><button class="empty">·</button><button data-d="left">◀</button><button data-d="down">▼</button><button data-d="right">▶</button></div><script src="common.js"></script><script>const cvs=document.getElementById("game"),ctx=cvs.getContext("2d"),info=document.getElementById("info"),scoreEl=document.getElementById("score");const N=20,C=20;let snake=[],dir={x:1,y:0},next={x:1,y:0},apples=[],score=0,run=false,timer=0;function reset(){clearTimeout(timer);snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10},{x:7,y:10}];dir={x:1,y:0};next={x:1,y:0};score=0;apples=[];while(apples.length<3)spawnApple();run=false;scoreEl.textContent="スコア 0";info.textContent="準備完了";draw()}function start(){reset();run=true;info.textContent="りんごを食べよう！";step()}function spawnApple(){let p;do p={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}while(snake.some(s=>s.x===p.x&&s.y===p.y)||apples.some(a=>a.x===p.x&&a.y===p.y));apples.push(p)}function setDir(d){const map={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};let v=map[d];if(!v||v.x===-dir.x&&v.y===-dir.y)return;next=v}document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>setDir(b.dataset.d));document.addEventListener("keydown",e=>({ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right"}[e.key]&&setDir(({ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right"})[e.key])));let sx=0,sy=0;cvs.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});cvs.addEventListener("touchend",e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;if(Math.abs(dx)>Math.abs(dy))setDir(dx>0?"right":"left");else setDir(dy>0?"down":"up")},{passive:true});function step(){if(!run)return;dir=next;let head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(head.x<0||head.x>=N||head.y<0||head.y>=N)return end("壁にぶつかった！");let ate=apples.some(a=>a.x===head.x&&a.y===head.y);let body=ate?snake:snake.slice(0,-1);if(body.some(s=>s.x===head.x&&s.y===head.y))return end("自分にぶつかった！");snake.unshift(head);if(ate){score++;apples=apples.filter(a=>!(a.x===head.x&&a.y===head.y));scoreEl.textContent="スコア "+score;navigator.vibrate?.(15);if(snake.length>=N*N){run=false;info.textContent="🎉 盤面制覇！ スコア "+score;draw();return}spawnApple()}else snake.pop();draw();timer=setTimeout(step,Math.max(65,125-score*2))}function end(m){run=false;info.textContent=m+"  スコア "+score;navigator.vibrate?.([70,40,70]);draw()}function draw(){ctx.fillStyle="#0b0f16";ctx.fillRect(0,0,400,400);ctx.strokeStyle="#172033";for(let i=0;i<=N;i++){ctx.beginPath();ctx.moveTo(i*C,0);ctx.lineTo(i*C,400);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*C);ctx.lineTo(400,i*C);ctx.stroke()}apples.forEach(a=>{ctx.fillStyle="#ef4444";ctx.beginPath();ctx.arc(a.x*C+10,a.y*C+10,7,0,7);ctx.fill()});snake.forEach((s,i)=>{ctx.fillStyle=i===0?"#60a5fa":"#2563eb";ctx.fillRect(s.x*C+2,s.y*C+2,16,16)})}GameKit.mount({title:"🐍 スネーク",intro:"りんごを食べるほど長くなります。壁や自分の体に当たると終了です。",howto:"スワイプ、または画面下の矢印ボタンで蛇を操作します。進行方向と逆方向にはすぐに曲がれません。りんごを食べるとスコアが増え、少しずつ速度も上がります。",onStart:start,onRestart:start});</script></body></html>
