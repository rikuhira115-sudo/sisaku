<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>反射神経 - ゲーム王国</title><style>html,body{margin:0;min-height:100%;background:#05070c;color:#fff;font-family:system-ui;text-align:center;overflow-x:hidden}h1{margin:15px 0 4px;font-size:1.7rem}.sub{color:#94a3b8;font-size:.9rem}.scoreRow{display:flex;justify-content:center;gap:8px;width:min(94vw,480px);margin:10px auto}.box{flex:1;padding:8px 6px;border:1px solid #33415c;border-radius:14px;background:#111827}.label{font-size:.72rem;color:#94a3b8}.value{font-size:1.35rem;font-weight:900}.arena{width:min(92vw,500px);height:min(48vh,420px);min-height:280px;margin:10px auto;border-radius:22px;background:#151a24;display:grid;place-items:center;touch-action:manipulation}.target{width:min(50vw,220px);height:min(50vw,220px);border-radius:50%;background:#293241;display:grid;place-items:center;font-size:1.2rem;font-weight:900}.go{background:#22c55e;box-shadow:0 0 45px #22c55e}.bad{background:#ef4444;box-shadow:0 0 35px #ef4444}.stat{min-height:24px;font-weight:800;color:#cbd5e1;font-size:.95rem}</style></head><body><h1>⚡ 反射神経</h1><div class="sub">一発勝負！緑になった瞬間をタップ</div><div class="scoreRow"><div class="box"><div class="label">今回</div><div id="current" class="value">-- ms</div></div><div class="box"><div class="label">前回の記録</div><div id="previous" class="value">-- ms</div></div><div class="box"><div class="label">ベスト</div><div id="best" class="value">-- ms</div></div></div><div id="stat" class="stat">スタートして待とう</div><div class="arena"><div id="target" class="target">START</div></div><script src="common.js"></script><script>const target=document.getElementById("target"),stat=document.getElementById("stat"),cur=document.getElementById("current"),prev=document.getElementById("previous"),best=document.getElementById("best");let state="idle",timer=0,started=0;function showRecords(){const p=localStorage.getItem("reactionPrevious"),b=localStorage.getItem("reactionBest");prev.textContent=p?p+" ms":"-- ms";best.textContent=b?b+" ms":"-- ms"}function reset(){clearTimeout(timer);state="idle";target.className="target";target.textContent="TAP";cur.textContent="-- ms";stat.textContent="円をタップして開始";showRecords()}function start(){clearTimeout(timer);state="wait";target.className="target";target.textContent="待って…";cur.textContent="-- ms";stat.textContent="緑になるまで押さない！";timer=setTimeout(()=>{state="go";started=performance.now();target.className="target go";target.textContent="TAP!"},900+Math.random()*2400)}target.onclick=()=>{if(state==="idle"){start();return}if(state==="wait"){clearTimeout(timer);state="idle";target.className="target bad";target.textContent="早い！";stat.textContent="フライング！ 最初からやり直し";navigator.vibrate?.(80);setTimeout(reset,900);return}if(state==="go"){const ms=Math.round(performance.now()-started);state="done";target.className="target";target.textContent=ms+" ms";cur.textContent=ms+" ms";localStorage.setItem("reactionPrevious",String(ms));const b=Number(localStorage.getItem("reactionBest")||0);if(!b||ms<b)localStorage.setItem("reactionBest",String(ms));showRecords();stat.textContent=ms<200?"🔥 超高速！":ms<300?"速い！":ms<400?"いい反応！":"もう一度挑戦してみよう";navigator.vibrate?.(25);GameKit.finish("反応速度 "+ms+" ms");}};GameKit.mount({title:"⚡ 反射神経",intro:"一発勝負で反応速度を測ります。記録は次回も残ります。",howto:"中央の円をタップすると計測準備に入ります。灰色の「待って…」中に押すとフライングです。緑色の「TAP!」が出た瞬間にタップしてください。1回だけ測定し、結果は「前回の記録」として保存されます。最速記録は「ベスト」に残ります。",onStart:start,onRestart:reset});reset()</script></body></html>
