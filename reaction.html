<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>反射神経 - ゲーム王国</title><style>body{margin:0;background:#05070c;color:#fff;font-family:system-ui;text-align:center;min-height:100vh}h1{margin:20px 0 4px}.sub{color:#94a3b8}.stat{font-size:1.15rem;font-weight:800;margin:12px}.arena{width:min(92vw,620px);height:min(58vh,520px);min-height:360px;margin:18px auto;border-radius:26px;background:#151a24;display:grid;place-items:center;touch-action:manipulation;user-select:none}.target{width:min(52vw,240px);height:min(52vw,240px);border-radius:50%;background:#293241;display:grid;place-items:center;font-size:1.35rem;font-weight:900;transition:.12s}.go{background:#22c55e;box-shadow:0 0 55px #22c55e}.bad{background:#ef4444;box-shadow:0 0 35px #ef4444}</style></head><body><h1>⚡ 反射神経</h1><div class="sub">緑になった瞬間を狙え！ 5回勝負</div><div id="stat" class="stat">準備完了</div><div class="arena"><div id="target" class="target">START</div></div><script src="common.js"></script><script>let target=document.getElementById("target"),stat=document.getElementById("stat"),state="start",timer=0,st=0,round=0,times=[];function reset(){clearTimeout(timer);state="start";round=0;times=[];target.className="target";target.textContent="START";stat.textContent="準備完了"}function begin(){round=1;times=[];wait()}function wait(){clearTimeout(timer);state="wait";target.className="target";target.textContent="待って…";stat.textContent=round+" / 5　緑になるまで待とう";timer=setTimeout(()=>{state="go";st=performance.now();target.className="target go";target.textContent="TAP!"},700+Math.random()*2300)}target.onclick=()=>{if(state==="start"){begin();return}if(state==="wait"){clearTimeout(timer);state="start";target.className="target bad";target.textContent="早い！";stat.textContent="フライング！";setTimeout(reset,900);return}if(state==="go"){let ms=Math.round(performance.now()-st);times.push(ms);state="result";target.className="target";target.textContent=ms+" ms";stat.textContent="第"+round+"回　"+ms+" ms";navigator.vibrate?.(20);if(round>=5){let avg=Math.round(times.reduce((a,b)=>a+b,0)/times.length);let best=Number(localStorage.getItem("reactionBest")||0);if(!best||avg<best)localStorage.setItem("reactionBest",avg);setTimeout(()=>{target.textContent="平均 "+avg+" ms";stat.textContent="5回終了！ ベスト平均 "+(localStorage.getItem("reactionBest")||avg)+" ms"},650)}else{round++;setTimeout(wait,750)}}};GameKit.mount({title:"⚡ 反射神経",intro:"緑色に変わった瞬間にタップします。全5回の平均タイムで勝負！",howto:"最初に「ゲーム開始」を押します。灰色の間に押すとフライングで失敗です。緑色になったらできるだけ早くタップしてください。5回の平均タイムが記録になります。目安：250ms以下ならかなり速いです。",onStart:begin,onRestart:reset});</script></body></html>
