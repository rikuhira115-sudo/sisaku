<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>反射神経 - ゲーム王国</title><style>body{margin:0;background:#05070c;color:#fff;font-family:system-ui;text-align:center}h1{margin:24px 0 4px}.sub{color:#94a3b8}.arena{height:55vh;min-height:330px;max-width:650px;margin:18px auto;border-radius:24px;background:#151a24;display:grid;place-items:center;touch-action:manipulation;user-select:none}.target{width:min(48vw,230px);height:min(48vw,230px);border-radius:50%;background:#252c38;display:grid;place-items:center;font-size:1.4rem;font-weight:800}.go{background:#31e981;box-shadow:0 0 45px #31e981}.bad{background:#ef4444}button{padding:12px 18px;border-radius:12px;border:1px solid #33415c;background:#121a29;color:#fff;font-weight:800}.stat{font-size:1.2rem;font-weight:800;margin:12px}</style></head><body><h1>⚡ 反射神経</h1><div class="sub">緑になった瞬間にタップ！</div><div class="stat" id="stat">STARTを押そう</div><div class="arena"><div class="target" id="target">START</div></div><button onclick="location.href='index.html'">← ゲーム王国</button><script>let t=document.getElementById("target"),s=document.getElementById("stat"),timer,go=false,st=0;t.onclick=()=>{if(t.textContent==="START"){wait();return}if(!go){clearTimeout(timer);t.className="target bad";t.textContent="早い！";s.textContent="フライング！";setTimeout(wait,800);return}let ms=Math.round(performance.now()-st);go=false;t.className="target";t.textContent=ms+"ms";s.textContent=ms+" ms";setTimeout(wait,1100)};function wait(){t.className="target";t.textContent="待って…";s.textContent="緑になるまで待とう";timer=setTimeout(()=>{go=true;st=performance.now();t.className="target go";t.textContent="TAP!"},900+Math.random()*2600)}</script></body></html>
