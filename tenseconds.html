<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>10秒チャレンジ</title><style>body{margin:0;background:#05070c;color:#fff;font-family:system-ui;text-align:center}h1{margin:28px 0 8px}.time{font-size:5rem;font-weight:900;margin:50px 0}.pad{width:180px;height:180px;border-radius:50%;border:0;background:#2563eb;color:#fff;font-size:1.5rem;font-weight:900;box-shadow:0 12px 40px #0008;touch-action:manipulation}.pad:active{transform:scale(.95)}#msg{color:#94a3b8;height:28px}.back{margin-top:28px;padding:11px 18px;background:#111827;color:#fff;border:1px solid #33415c;border-radius:12px;font-weight:800}</style></head><body><h1>⏱️ 10秒チャレンジ</h1><div id="msg">ボタンを押して開始</div><div class="time" id="time">10.00</div><button class="pad" id="pad">START</button><br><button class="back" onclick="location.href='index.html'">← ゲーム王国</button><script>let p=document.getElementById("pad"),tm=document.getElementById("time"),m=document.getElementById("msg"),st=0,r=false;function loop(){if(!r)return;let x=(performance.now()-st)/1000;tm.textContent=Math.max(0,10-x).toFixed(2);requestAnimationFrame(loop)}p.onclick=()=>{if(!r&&p.textContent==="START"){r=true;st=performance.now();p.textContent="STOP";m.textContent="10.00秒で止めよう";loop()}else if(r){let x=(performance.now()-st)/1000,d=Math.abs(10-x);r=false;tm.textContent=x.toFixed(2);m.textContent=d<.1?"神業！ "+d.toFixed(2)+"秒差":d<.3?"惜しい！ "+d.toFixed(2)+"秒差":d.toFixed(2)+"秒差";p.textContent="もう一度"}else{p.textContent="START";tm.textContent="10.00";m.textContent="ボタンを押して開始"}};</script></body></html>
