<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta name="theme-color" content="#05070c"><title>10秒チャレンジ - ゲーム王国</title><style>
body{margin:0;background:#05070c;color:#fff;font-family:system-ui;text-align:center;min-height:100vh;overflow-x:hidden}
h1{margin:24px 0 6px}.subtitle{color:#94a3b8}.resultRow{display:flex;justify-content:center;align-items:stretch;gap:10px;margin:24px auto 18px;width:min(92vw,460px)}
.timeBox{flex:1;min-width:0;background:#111827;border:1px solid #33415c;border-radius:18px;padding:14px 8px}.label{font-size:.78rem;color:#94a3b8}.time{font-size:clamp(2.8rem,13vw,5rem);font-weight:900;line-height:1.1;margin-top:7px;font-variant-numeric:tabular-nums}.target{border-color:#2563eb}.target .time{color:#60a5fa}.pad{width:min(54vw,210px);aspect-ratio:1;border:0;border-radius:50%;background:#2563eb;color:#fff;font-size:1.5rem;font-weight:900;box-shadow:0 12px 40px #0008;touch-action:manipulation}.pad:active{transform:scale(.95)}.msg{min-height:28px;color:#cbd5e1;font-weight:800}.startHint{font-size:.82rem;color:#64748b;margin-top:12px}
</style></head><body><h1>⏱️ 10秒チャレンジ</h1><div class="subtitle">10.00秒を狙って止めよう</div>
<div class="resultRow"><div class="timeBox target"><div class="label">今回</div><div id="time" class="time">0.00</div><div class="label">秒</div></div><div class="timeBox"><div class="label">前回の記録</div><div id="previous" class="time">--.--</div><div class="label">秒</div></div></div>
<div id="msg" class="msg">スタートを押して開始</div><button id="pad" class="pad">START</button><div class="startHint">開始後、10.00秒だと思った瞬間にSTOP</div>
<script src="common.js"></script><script>
const pad=document.getElementById("pad"),timeEl=document.getElementById("time"),prevEl=document.getElementById("previous"),msg=document.getElementById("msg");
let running=false,startedAt=0,raf=0;
function previous(){const v=localStorage.getItem("tenSecondsPrevious");return v===null?"--.--":Number(v).toFixed(2)}
function showPrevious(){prevEl.textContent=previous()}
function reset(){running=false;cancelAnimationFrame(raf);timeEl.textContent="0.00";msg.textContent="スタートを押して開始";pad.textContent="START";showPrevious()}
function start(){running=true;startedAt=performance.now();timeEl.textContent="0.00";msg.textContent="計測中… 10.00秒で止めよう";pad.textContent="STOP";loop()}
function loop(){if(!running)return;const elapsed=(performance.now()-startedAt)/1000;timeEl.textContent=elapsed.toFixed(2);raf=requestAnimationFrame(loop)}
function stop(){const elapsed=(performance.now()-startedAt)/1000;running=false;cancelAnimationFrame(raf);timeEl.textContent=elapsed.toFixed(2);const diff=Math.abs(10-elapsed);localStorage.setItem("tenSecondsPrevious",elapsed.toFixed(2));showPrevious();msg.textContent=diff<.05?"🎯 ほぼ完璧！":diff<.15?"🔥 かなり惜しい！":diff<.5?"惜しい！":"もう少し！";pad.textContent="START";navigator.vibrate?.(diff<.15?[20,20,20]:40)}
pad.onclick=()=>{if(!running)start();else stop()}
GameKit.mount({title:"⏱️ 10秒チャレンジ",intro:"0.00秒からカウントアップ。10.00秒だと思った瞬間に止めるゲームです。",howto:"「スタート」または中央のSTARTを押すと、0.00秒からカウントアップします。自分の感覚で10.00秒になったと思った瞬間にSTOPを押してください。終了後は今回の記録が「前回の記録」として残り、次に遊ぶときも横に表示されます。",onStart:start,onRestart:reset});
reset();
</script></body></html>
