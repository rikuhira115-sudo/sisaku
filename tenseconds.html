<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>10秒チャレンジ - ゲーム王国</title><style>html,body{margin:0;min-height:100%;background:#05070c;color:#fff;font-family:system-ui;text-align:center;overflow-x:hidden}h1{margin:16px 0 4px;font-size:1.7rem}.subtitle{color:#94a3b8;font-size:.9rem}.resultRow{display:flex;justify-content:center;gap:8px;margin:14px auto;width:min(94vw,430px)}.timeBox{flex:1;background:#111827;border:1px solid #33415c;border-radius:16px;padding:10px 5px}.label{font-size:.7rem;color:#94a3b8}.time{font-size:clamp(2rem,10vw,3.7rem);font-weight:900;line-height:1.08;font-variant-numeric:tabular-nums}.target{border-color:#2563eb}.target .time{color:#60a5fa}.msg{min-height:26px;color:#cbd5e1;font-weight:800}.pad{width:min(50vw,190px);aspect-ratio:1;border:0;border-radius:50%;background:#2563eb;color:#fff;font-size:1.4rem;font-weight:900;box-shadow:0 12px 40px #0008;touch-action:manipulation}.pad:active{transform:scale(.95)}.hint{margin-top:10px;color:#64748b;font-size:.78rem}</style></head><body><h1>⏱️ 10秒チャレンジ</h1><div class="subtitle">0.00秒から数えて、10.00秒で止めよう</div><div class="resultRow"><div class="timeBox target"><div class="label">今回</div><div id="time" class="time">0.00</div><div class="label">秒</div></div><div class="timeBox"><div class="label">前回の記録</div><div id="previous" class="time">--.--</div><div class="label">秒</div></div></div><div id="msg" class="msg">スタートを押して開始</div><button id="pad" class="pad">START</button><div class="hint">開始後はカウントアップ。10.00秒だと思ったらSTOP。</div><script src="common.js"></script><script>const pad=document.getElementById("pad"),timeEl=document.getElementById("time"),prevEl=document.getElementById("previous"),msg=document.getElementById("msg");let running=false,startedAt=0,raf=0;function showPrev(){const p=localStorage.getItem("tenSecondsPrevious");prevEl.textContent=p===null?"--.--":Number(p).toFixed(2)}function reset(){running=false;cancelAnimationFrame(raf);timeEl.textContent="0.00";msg.textContent="スタートを押して開始";pad.textContent="START";showPrev()}function start(){running=true;startedAt=performance.now();timeEl.textContent="0.00";msg.textContent="計測中…";pad.textContent="STOP";tick()}function tick(){if(!running)return;timeEl.textContent=((performance.now()-startedAt)/1000).toFixed(2);raf=requestAnimationFrame(tick)}function stop(){const e=(performance.now()-startedAt)/1000;running=false;cancelAnimationFrame(raf);timeEl.textContent=e.toFixed(2);localStorage.setItem("tenSecondsPrevious",e.toFixed(2));showPrev();const d=Math.abs(10-e);msg.textContent=d<.05?"🎯 完璧！":d<.15?"🔥 かなり惜しい！":d<.5?"惜しい！":"また挑戦！";pad.textContent="START"}pad.onclick=()=>running?stop():start();GameKit.mount({title:"⏱️ 10秒チャレンジ",intro:"0.00秒からカウントアップして、10.00秒で止めます。前回の記録も表示されます。",howto:"「スタート」を押すと0.00秒からカウントアップします。10.00秒だと思った瞬間にSTOPを押してください。結果はすぐに「前回の記録」に保存され、次に遊ぶときも表示されます。",onStart:start,onRestart:reset});reset()</script></body></html>
