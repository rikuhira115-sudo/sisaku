<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>10秒チャレンジ - ゲーム王国</title><style>html,body{margin:0;min-height:100%;background:#05070c;color:#fff;font-family:system-ui;text-align:center;overflow-x:hidden}h1{margin:16px 0 4px;font-size:1.7rem}.subtitle{color:#94a3b8;font-size:.9rem}.resultRow{display:flex;justify-content:center;gap:8px;margin:14px auto;width:min(94vw,430px)}.timeBox{flex:1;background:#111827;border:1px solid #33415c;border-radius:16px;padding:10px 5px}.label{font-size:.7rem;color:#94a3b8}.time{font-size:clamp(1.7rem,8vw,3.2rem);font-weight:900;line-height:1.08;font-variant-numeric:tabular-nums}.target{border-color:#2563eb}.target .time{color:#60a5fa}.msg{min-height:26px;color:#cbd5e1;font-weight:800}.pad{width:min(50vw,190px);aspect-ratio:1;border:0;border-radius:50%;background:#2563eb;color:#fff;font-size:1.4rem;font-weight:900;box-shadow:0 12px 40px #0008;touch-action:manipulation}.pad:active{transform:scale(.95)}.hint{margin-top:10px;color:#64748b;font-size:.78rem}</style></head><body><h1>⏱️ 10秒チャレンジ</h1><div class="subtitle">0.00秒から数えて、10.00秒で止めよう</div><div class="resultRow"><div class="timeBox target"><div class="label">今回</div><div id="time" class="time">0.00</div><div class="label">秒</div></div><div class="timeBox"><div class="label">前回</div><div id="previous" class="time">--.--</div><div class="label">秒</div></div><div class="timeBox"><div class="label">ベスト</div><div id="best" class="time">--.--</div><div class="label">秒</div></div></div><div id="msg" class="msg">円をタップして開始</div><button id="pad" class="pad">TAP</button><div class="hint">STOPを押すタイミングだけが勝負。Spaceキーでも操作できます。</div><script src="common.js"></script><script>const pad=document.getElementById("pad"),timeEl=document.getElementById("time"),prevEl=document.getElementById("previous"),bestEl=document.getElementById("best"),msg=document.getElementById("msg");let running=false,startedAt=0,raf=0;function showRecords(){const p=localStorage.getItem("tenSecondsPrevious"),b=localStorage.getItem("tenSecondsBest");prevEl.textContent=p===null?"--.--":Number(p).toFixed(2);bestEl.textContent=b===null?"--.--":Number(b).toFixed(2)}function reset(){running=false;cancelAnimationFrame(raf);timeEl.textContent="0.00";msg.textContent="円をタップして開始";pad.textContent="TAP";showRecords()}function start(){running=true;startedAt=performance.now();timeEl.textContent="0.00";msg.textContent="計測中…";pad.textContent="STOP";tick()}function tick(){if(!running)return;timeEl.textContent=((performance.now()-startedAt)/1000).toFixed(2);raf=requestAnimationFrame(tick)}function stop(){if(!running)return;const e=(performance.now()-startedAt)/1000;running=false;cancelAnimationFrame(raf);timeEl.textContent=e.toFixed(2);const d=Math.abs(10-e);const b=localStorage.getItem("tenSecondsBest");const best=Number(b);const isBest=!b||d<Math.abs(10-best);localStorage.setItem("tenSecondsPrevious",e.toFixed(2));if(isBest)localStorage.setItem("tenSecondsBest",e.toFixed(2));showRecords();msg.textContent=isBest?"🏆 新記録！ 誤差 ±"+d.toFixed(2)+"秒":d<.05?"🎯 ほぼ完璧！ 誤差 ±"+d.toFixed(2)+"秒":d<.15?"🔥 かなり惜しい！ 誤差 ±"+d.toFixed(2)+"秒":d<.5?"惜しい！ 誤差 ±"+d.toFixed(2)+"秒":"また挑戦！ 誤差 ±"+d.toFixed(2)+"秒";pad.textContent="TAP";GameKit.finish("記録 "+e.toFixed(2)+" 秒 / 誤差 ±"+d.toFixed(2)+" 秒")}pad.onclick=()=>running?stop():start();document.addEventListener("keydown",e=>{if(e.code==="Space"){e.preventDefault();pad.click()}});GameKit.mount({title:"⏱️ 10秒チャレンジ",intro:"10.00秒を狙うタイミングゲームです。",howto:"円をタップして開始し、10.00秒だと思った瞬間にSTOPを押してください。Spaceキーでも操作できます。結果には実測時間と10秒からの誤差が表示され、最も10秒に近かった記録がベストとして残ります。",onStart:start,onRestart:reset});reset()</script></body></html>
