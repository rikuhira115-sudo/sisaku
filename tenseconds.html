<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>10秒チャレンジ</title><style>body{margin:0;background:#05070c;color:#fff;font-family:system-ui;text-align:center}h1{margin:28px 0 6px}.time{font-size:clamp(4rem,18vw,7rem);font-weight:900;margin:45px 0 20px}.msg{color:#94a3b8;min-height:28px}.pad{width:min(56vw,210px);aspect-ratio:1;border:0;border-radius:50%;background:#2563eb;color:#fff;font-size:1.5rem;font-weight:900;box-shadow:0 12px 40px #0008;touch-action:manipulation}.pad:active{transform:scale(.95)}body.r{background:radial-gradient(circle at 50% 45%,#123d80,#05070c 55%)}</style></head><body><h1>⏱️ 10秒チャレンジ</h1><div id="msg" class="msg">10.00秒ぴったりを狙おう</div><div id="time" class="time">10.00</div><button id="pad" class="pad">START</button><script src="common.js"></script><script>const pad=document.getElementById("pad"),time=document.getElementById("time"),msg=document.getElementById("msg");let running=false,st=0,raf=0;function reset(){running=false;cancelAnimationFrame(raf);document.body.classList.remove("r");time.textContent="10.00";msg.textContent="10.00秒ぴったりを狙おう";pad.textContent="START"}function tick(){if(!running)return;const e=(performance.now()-st)/1000;time.textContent=Math.max(0,10-e).toFixed(2);raf=requestAnimationFrame(tick)}function start(){running=true;st=performance.now();document.body.classList.add("r");pad.textContent="STOP";msg.textContent="10.00秒で止める！";tick()}pad.onclick=()=>{if(!running&&pad.textContent==="START")start();else if(running){const e=(performance.now()-st)/1000,d=Math.abs(10-e);running=false;cancelAnimationFrame(raf);time.textContent=e.toFixed(2);msg.textContent=d<.05?"🎯 完璧！":d<.15?"🔥 かなり惜しい！":d<.5?"惜しい！":"もう少し！";pad.textContent="もう一度"}else start()};GameKit.mount({title:"⏱️ 10秒チャレンジ",intro:"10.00秒で止めるだけ。でも意外と難しい。",howto:"「START」で計測開始→自分で10.00秒だと思った瞬間に「STOP」。表示された時間との差が小さいほど高得点です。",onStart:start,onRestart:reset});</script></body></html>
