<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>記憶シーケンス</title><style>body{margin:0;background:#05070c;color:#fff;font-family:system-ui;text-align:center}h1{margin:22px 0 6px}.info{min-height:28px;color:#94a3b8;font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:min(92vw,420px);margin:25px auto}.cell{aspect-ratio:1;border:0;border-radius:18px;background:#1e293b;box-shadow:inset 0 -5px #0f172a;touch-action:manipulation}.on{background:#60a5fa;box-shadow:0 0 28px #60a5fa}.picked{background:#22c55e}.danger{background:#ef4444}</style><body><h1>🧠 記憶シーケンス</h1><div id="info" class="info">光った順番を覚えよう</div><div id="grid" class="grid"></div><script src="common.js"></script><script>const grid=document.getElementById("grid"),info=document.getElementById("info");let seq=[],pos=0,level=1,locked=true,timers=[];for(let n=0;n<9;n++){const b=document.createElement("button");b.className="cell";b.onclick=()=>pick(n);grid.appendChild(b)}function clearTimers(){timers.forEach(clearTimeout);timers=[]}function reset(){clearTimers();level=1;locked=true;seq=[];pos=0;grid.querySelectorAll(".cell").forEach(b=>b.className="cell");info.textContent="準備完了"}function start(){clearTimers();level=1;show()}function show(){clearTimers();locked=true;pos=0;seq=[];while(seq.length<level){let n=Math.floor(Math.random()*9);if(seq[seq.length-1]!==n)seq.push(n)}info.textContent="レベル "+level+"：光った順番を覚えよう";seq.forEach((n,k)=>{timers.push(setTimeout(()=>{grid.children[n].classList.add("on");timers.push(setTimeout(()=>grid.children[n].classList.remove("on"),260))},k*470))});timers.push(setTimeout(()=>{locked=false;info.textContent="同じ順番でタップ！"},seq.length*470+250))}function pick(n){if(locked)return;if(n!==seq[pos]){locked=true;grid.children[n].classList.add("danger");navigator.vibrate?.(80);info.textContent="ミス！ レベル "+level;setTimeout(()=>grid.children[n].classList.remove("danger"),350);return}grid.children[n].classList.add("picked");setTimeout(()=>grid.children[n].classList.remove("picked"),150);pos++;if(pos===seq.length){locked=true;info.textContent="正解！";level++;setTimeout(show,650)}}GameKit.mount({title:"🧠 記憶シーケンス",intro:"光ったマスを、同じ順番で押していこう。",howto:"最初に青く光るマスの順番を覚えます。光が消えたら、その順番どおりにタップします。1レベル上がるごとに覚える数が1つ増えます。",onStart:start,onRestart:reset});</script></body></html>
