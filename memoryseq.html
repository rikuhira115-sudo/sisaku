<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>記憶シーケンス</title><style>body{margin:0;background:#05070c;color:#fff;font-family:system-ui;text-align:center}h1{margin:24px 0 6px}.info{height:28px;color:#94a3b8}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:min(92vw,420px);margin:25px auto}.cell{aspect-ratio:1;border:0;border-radius:18px;background:#1e293b}.on{background:#60a5fa;box-shadow:0 0 25px #60a5fa}.off{opacity:.35}.back{padding:11px 18px;border-radius:12px;border:1px solid #33415c;background:#111827;color:#fff;font-weight:800}</style><h1>🧠 記憶シーケンス</h1><div class="info" id="i">順番を覚えよう</div><div class="grid" id="g"></div><button class="back" onclick="location.href='index.html'">← ゲーム王国</button><script>let g=document.getElementById("g"),i=document.getElementById("i"),seq=[],input=0,level=1,locked=true;for(let n=0;n<9;n++){let b=document.createElement("button");b.className="cell";b.onclick=()=>click(n);g.appendChild(b)}function show(){locked=true;input=0;seq=[...Array(level)].map(()=>Math.floor(Math.random()*9));i.textContent=level+"個の順番を覚えよう";seq.forEach((n,k)=>setTimeout(()=>{g.children[n].className="cell on";setTimeout(()=>g.children[n].className="cell",220)},k*430));setTimeout(()=>{locked=false;i.textContent="同じ順番でタップ！"},seq.length*430+350)}function click(n){if(locked)return;if(n!==seq[input]){navigator.vibrate?.(100);i.textContent="ミス！ レベル "+level+" で終了";locked=true;return}g.children[n].className="cell on";setTimeout(()=>g.children[n].className="cell",130);input++;if(input===seq.length){level++;locked=true;i.textContent="正解！";setTimeout(show,600)}}show()</script></html>
