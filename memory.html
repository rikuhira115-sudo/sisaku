<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>神経衰弱 - ゲーム王国</title><style>body{margin:0;background:#05070c;color:#fff;font-family:system-ui;text-align:center}.controls{margin:6px 0 10px}.sizeBtn{padding:8px 12px;border:1px solid #33415c;background:#111827;color:#fff;border-radius:10px;font-weight:800}.sizeBtn.on{background:#2563eb}.score{font-weight:900;min-height:28px}.board{display:grid;gap:7px;width:min(94vw,580px);margin:14px auto}.card{border:0;border-radius:11px;background:linear-gradient(145deg,#293241,#111827);color:#fff;aspect-ratio:1/1.18;font-size:clamp(1.1rem,5vw,2.2rem);font-weight:900;box-shadow:inset 0 1px #64748b55,0 5px 12px #0005;touch-action:manipulation;transition:.15s}.card.open{background:#f8fafc;color:#111}.card.p1{background:#2563eb;color:#fff}.card.p2{background:#dc2626;color:#fff}.card:active{transform:scale(.96)}.status{color:#94a3b8;min-height:28px;font-weight:800}</style></head><body><h1>🃏 神経衰弱</h1><div class="status" id="status">Player1からスタート</div><div class="score" id="score">Player1 0　|　Player2 0</div><div class="controls"><button class="sizeBtn on" data-s="4">4×4</button><button class="sizeBtn" data-s="6">6×6</button><button class="sizeBtn" data-s="8">8×8</button></div><div id="board" class="board"></div><script src="common.js"></script><script>const symbols=["🍎","🍌","🍇","🍒","🍉","🥝","🍑","🍍","🥥","🍓","🍈","🍋","🍐","🥭","🍅","🥕","🌽","🍆","🥦","🥔","🍪","🍩","🍰","🍔","🍟","🍕","🌮","🍣","🍙","🍜","🍦","🍿","⚽","🏀","🎸","🚗","✈️","⭐","🌙","🔥","❄️","🌈","🐶","🐱","🐸","🦊","🐼"];let size=4,cards=[],open=[],matched=new Set(),matchedOwner=new Map(),p=1,s1=0,s2=0,locked=false,matchTimer=0;const boardEl=document.getElementById("board"),statusEl=document.getElementById("status"),scoreEl=document.getElementById("score");function shuffle(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}function reset(n=size){clearTimeout(matchTimer);size=n;cards=[];open=[];matched=new Set();matchedOwner=new Map();p=1;s1=s2=0;locked=false;let use=symbols.slice(0,size*size/2);cards=[...use,...use];shuffle(cards);boardEl.style.gridTemplateColumns="repeat("+size+",1fr)";render();update()}function start(){reset(size)}function update(){statusEl.textContent="Player"+p+" の番";scoreEl.textContent="Player1 "+s1+"　|　Player2 "+s2}function render(){boardEl.innerHTML="";cards.forEach((v,i)=>{let c=document.createElement("button");c.className="card";if(open.includes(i)||matched.has(i)){c.classList.add("open");c.textContent=v}if(matched.has(i))c.classList.add(matched.get?"" :"");boardEl.appendChild(c);c.onclick=()=>flip(i)})}function markMatched(a,b){matched.add(a);matched.add(b);matchedOwner.set(a,p);matchedOwner.set(b,p);let els=boardEl.children;els[a].classList.add(p===1?"p1":"p2");els[b].classList.add(p===1?"p1":"p2")}function flip(i){if(locked||matched.has(i)||open.includes(i))return;open.push(i);render();if(open.length<2)return;locked=true;matchTimer=setTimeout(()=>{let[a,b]=open;if(cards[a]===cards[b]){markMatched(a,b);if(p===1)s1++;else s2++;open=[];locked=false;render();update();if(matched.size===cards.length)finish();}else{open=[];p=3-p;locked=false;render();update()}},600)}function finish(){locked=true;statusEl.textContent=s1>s2?"🏆 Player1の勝ち！":s2>s1?"🏆 Player2の勝ち！":"引き分け！";}document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-s]").forEach(x=>x.classList.remove("on"));b.classList.add("on");reset(Number(b.dataset.s))});GameKit.mount({title:"🃏 神経衰弱（対戦）",intro:"2枚めくって同じ絵なら得点。カードの位置を覚えて勝負！",howto:"Player1から開始。1回に2枚までカードをめくれます。同じ絵なら1点獲得して、同じプレイヤーが続けて挑戦できます。違ったら相手の番です。8×8も遊べるように絵柄を十分用意しています。",onStart:start,onRestart:start});reset()</script></body></html>
