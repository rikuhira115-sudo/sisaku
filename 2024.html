<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>2024 パズル</title><style>body{margin:0;background:#05070c;color:#fff;font-family:system-ui;text-align:center}h1{margin:18px 0 5px}.score{font-size:1.2rem;font-weight:900;margin:8px}.board{width:min(92vw,390px);aspect-ratio:1;margin:14px auto;background:#111827;padding:8px;border-radius:16px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;touch-action:none}.cell{border:0;border-radius:10px;background:#252b36;display:grid;place-items:center;font-size:clamp(1.2rem,7vw,2rem);font-weight:900;color:#fff}.n2{background:#475569}.n4{background:#64748b}.n8{background:#b45309}.n16{background:#dc2626}.n32{background:#e11d48}.n64{background:#db2777}.n128{background:#d97706}.n256{background:#ca8a04}.n512{background:#ea580c}.n1024{background:#c2410c}.n2048{background:#9333ea;box-shadow:0 0 22px #9333ea}.pop{animation:pop .16s}@keyframes pop{50%{transform:scale(1.12)}}.pad{display:grid;grid-template-columns:64px 64px 64px;gap:6px;justify-content:center}.pad button{height:54px;border:1px solid #33415c;border-radius:12px;background:#111827;color:#fff;font-size:1.4rem;font-weight:900}.none{visibility:hidden}.status{color:#94a3b8;min-height:26px;font-weight:800}</style></head><body><h1>🔢 2024 パズル</h1><div id="score" class="score">スコア 0</div><div id="status" class="status">同じ数字を合体させよう</div><div id="board" class="board"></div><div class="pad"><button class="none">·</button><button data-d="up">▲</button><button class="none">·</button><button data-d="left">◀</button><button data-d="down">▼</button><button data-d="right">▶</button></div><script src="common.js"></script><script>const SIZE=4,b=document.getElementById("board"),scoreEl=document.getElementById("score"),statusEl=document.getElementById("status");let a=[],score=0,over=false;function reset(){a=Array.from({length:SIZE},()=>Array(SIZE).fill(0));score=0;over=false;add();add();render();statusEl.textContent="同じ数字を合体させよう"}function start(){reset()}function add(){let e=[];for(let y=0;y<SIZE;y++)for(let x=0;x<SIZE;x++)if(!a[y][x])e.push([x,y]);if(!e.length)return;let [x,y]=e[Math.floor(Math.random()*e.length)];a[y][x]=Math.random()<.9?2:4}function slide(line){let vals=line.filter(v=>v),out=[];for(let i=0;i<vals.length;i++){if(i+1<vals.length&&vals[i]===vals[i+1]){let v=vals[i]*2;out.push(v);score+=v;i++}else out.push(vals[i])}while(out.length<SIZE)out.push(0);return out}function move(d){if(over)return;let before=a.map(r=>r.slice());if(d==="left"||d==="right")for(let y=0;y<SIZE;y++){let l=a[y].slice();if(d==="right")l.reverse();l=slide(l);if(d==="right")l.reverse();a[y]=l}else for(let x=0;x<SIZE;x++){let l=[];for(let y=0;y<SIZE;y++)l.push(a[y][x]);if(d==="down")l.reverse();l=slide(l);if(d==="down")l.reverse();for(let y=0;y<SIZE;y++)a[y][x]=l[y]}if(JSON.stringify(before)!==JSON.stringify(a)){add();render();navigator.vibrate?.(12);if(a.flat().includes(2048))statusEl.textContent="🎉 2048達成！";if(!canMove()){over=true;statusEl.textContent="ゲームオーバー！ スコア "+score;GameKit.finish("ゲームオーバー！ スコア "+score)}}}function canMove(){if(a.flat().some(v=>!v))return true;for(let y=0;y<SIZE;y++)for(let x=0;x<SIZE;x++){if(x+1<SIZE&&a[y][x]===a[y][x+1])return true;if(y+1<SIZE&&a[y][x]===a[y+1][x])return true}return false}function render(){b.innerHTML="";for(let y=0;y<SIZE;y++)for(let x=0;x<SIZE;x++){let c=document.createElement("button");c.className="cell";let v=a[y][x];if(v){c.textContent=v;c.classList.add("n"+v,"pop")}b.appendChild(c)}scoreEl.textContent="スコア "+score}document.addEventListener("keydown",e=>{let d={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right"}[e.key];if(d){e.preventDefault();move(d)}});document.querySelectorAll("[data-d]").forEach(x=>x.onclick=()=>move(x.dataset.d));let sx=0,sy=0;b.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});b.addEventListener("touchend",e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;move(Math.abs(dx)>Math.abs(dy)?(dx>0?"right":"left"):(dy>0?"down":"up"))},{passive:true});GameKit.mount({title:"🔢 2024 パズル",intro:"同じ数字を重ねて、どこまで大きくできるか挑戦！",howto:"スワイプ、キーボード、画面下の矢印ボタンで数字を動かします。同じ数字が隣り合うと合体します。動かすたびに新しい2または4が1個出ます。動かせなくなったらゲームオーバーです。",onStart:start,onRestart:start});reset();</script></body></html>
