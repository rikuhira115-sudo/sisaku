<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>隕石よけ</title><style>body{margin:0;background:#030712;color:#fff;font-family:system-ui;text-align:center;touch-action:none}h1{margin:18px 0 4px}.info{color:#94a3b8}.field{position:relative;width:min(92vw,420px);height:62vh;min-height:430px;margin:15px auto;border:1px solid #334155;border-radius:20px;background:linear-gradient(#0b1220,#050810);overflow:hidden}.player{position:absolute;width:34px;height:34px;border-radius:50%;background:#38bdf8;bottom:22px;left:50%;transform:translateX(-50%);box-shadow:0 0 20px #38bdf8}.rock{position:absolute;width:28px;height:28px;border-radius:50%;background:#fb7185;box-shadow:0 0 12px #fb7185}.btn{padding:11px 18px;border-radius:12px;border:1px solid #33415c;background:#111827;color:#fff;font-weight:800}.hint{font-size:.82rem;color:#64748b}.over{font-size:1.4rem;font-weight:800}</style><h1>☄️ 隕石よけ</h1><div class="info" id="info">左右にスワイプして隕石を避けろ</div><div class="field" id="field"><div class="player" id="p"></div></div><div class="over" id="over"></div><button class="btn" onclick="location.href='index.html'">← ゲーム王国</button><script>let f=document.getElementById("field"),p=document.getElementById("p"),x=.5,running=true,t=0,last=0,spawn=0;function move(clientX){let z=f.getBoundingClientRect();x=Math.max(.05,Math.min(.95,(clientX-z.left)/z.width));p.style.left=x*100+"%"}f.addEventListener("pointermove",e=>e.buttons&&move(e.clientX));f.addEventListener("pointerdown",e=>move(e.clientX));function add(){let r=document.createElement("div");r.className="rock";r.style.left=(5+Math.random()*90)+"%";r.style.top="-35px";r.dataset.y=-35;r.dataset.x=parseFloat(r.style.left)/100;f.appendChild(r)}function loop(ms){if(!running)return;if(!last)last=ms;let dt=Math.min(40,ms-last);last=ms;t+=dt;spawn+=dt;if(spawn>Math.max(220,520-t/30)){spawn=0;add()}f.querySelectorAll(".rock").forEach(r=>{let y=(+r.dataset.y)+dt*(.22+t/5000);r.dataset.y=y;r.style.top=y+"px";let px=x*f.clientWidth,rx=r.dataset.x*f.clientWidth;if(y>f.clientHeight-75&&y<f.clientHeight-10&&Math.abs(px-rx)<40)end();if(y>f.clientHeight+40)r.remove()});document.getElementById("info").textContent="生存 "+(t/1000).toFixed(1)+"秒";requestAnimationFrame(loop)}function end(){running=false;document.getElementById("over").textContent="💥 撃墜！ "+(t/1000).toFixed(1)+"秒";navigator.vibrate?.([80,50,80])}requestAnimationFrame(loop)</script></html>
