<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>カラータップ</title><style>body{margin:0;background:#05070c;color:#fff;font-family:system-ui;text-align:center}h1{margin:25px 0 5px}.q{font-size:1.5rem;color:#9fb0c8;margin:20px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:420px;margin:20px auto;padding:15px}.c{height:120px;border:0;border-radius:22px;touch-action:manipulation;box-shadow:0 8px 25px #0006}.info{font-size:1.2rem;font-weight:800}.back{margin:10px;padding:11px 18px;border-radius:12px;border:1px solid #33415c;background:#111827;color:#fff}</style></head><body><h1>🎨 カラータップ</h1><div class="info" id="info">タップして開始</div><div class="q" id="q">---</div><div class="choices" id="choices"></div><button class="back" onclick="location.href='index.html'">← ゲーム王国</button><script>const colors=[["赤","#ef4444"],["青","#3b82f6"],["緑","#22c55e"],["黄","#eab308"],["紫","#a855f7"],["橙","#f97316"]];let score=0,left=20,ans="",started=false;const q=document.getElementById("q"),ch=document.getElementById("choices"),info=document.getElementById("info");function next(){let a=colors[Math.floor(Math.random()*colors.length)];ans=a[0];q.textContent=a[0];ch.innerHTML="";[...colors].sort(()=>Math.random()-.5).slice(0,4).forEach(c=>{let b=document.createElement("button");b.className="c";b.style.background=c[1];b.onclick=()=>{if(c[0]===ans)score++;else left--;if(left<=0){q.textContent="終了！";ch.innerHTML="";info.textContent=score+"点 / 20問";started=false;left=20;score=0;setTimeout(()=>{q.textContent="---";info.textContent="タップして再挑戦"},900)}else{info.textContent="残り "+left+"問　スコア "+score;next()}};ch.appendChild(b)});info.textContent="残り "+left+"問　スコア "+score}document.body.onclick=e=>{if(!started&&q.textContent==="---"){started=true;next()}}</script></body></html>
