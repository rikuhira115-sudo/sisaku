<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>ブリックブレイク</title><style>body{margin:0;background:#030712;color:#fff;font-family:system-ui;text-align:center}h1{margin:15px}.info{color:#94a3b8}canvas{display:block;width:min(94vw,420px);height:auto;margin:15px auto;background:#0b1220;border:1px solid #334155;border-radius:14px;touch-action:none}.back{padding:10px 17px;border-radius:12px;background:#111827;border:1px solid #33415c;color:#fff;font-weight:800}</style><h1>🧱 ブリックブレイク</h1><div class="info" id="i">画面を左右に動かしてバー操作</div><canvas id="c" width="420" height="560"></canvas><button class="back" onclick="location.href='index.html'">← ゲーム王国</button><script>let c=document.getElementById("c"),x=c.getContext("2d"),px=180,bx=210,by=500,dx=3,dy=-4,br=[];for(let r=0;r<6;r++)for(let k=0;k<7;k++)br.push({x:10+k*58,y:30+r*30,on:1});c.addEventListener("pointermove",e=>{let q=c.getBoundingClientRect();px=(e.clientX-q.left)/q.width*420-45});function loop(){x.clearRect(0,0,420,560);x.fillStyle="#fff";x.fillRect(px,530,90,12);x.beginPath();x.arc(bx,by,8,0,7);x.fill();br.forEach(b=>{if(b.on){x.fillStyle="#38bdf8";x.fillRect(b.x,b.y,54,22)}});bx+=dx;by+=dy;if(bx<8||bx>412)dx*=-1;if(by<8)dy*=-1;if(by>520&&by<545&&bx>px-8&&bx<px+98){dy=-Math.abs(dy)-.05;if(Math.abs(bx-(px+45))>30)dx=(bx-(px+45))/12}br.forEach(b=>{if(b.on&&bx>b.x&&bx<b.x+54&&by>b.y&&by<b.y+22){b.on=0;dy*=-1}});if(by>575){document.getElementById("i").textContent="ゲームオーバー。画面をタップでリセット";c.onclick=()=>location.reload();return}if(br.every(b=>!b.on)){document.getElementById("i").textContent="🎉 全ブロック破壊！";return}requestAnimationFrame(loop)}loop()</script></html>
