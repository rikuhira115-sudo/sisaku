<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>ブリックブレイク</title><style>body{margin:0;background:#030712;color:#fff;font-family:system-ui;text-align:center}h1{margin:16px 0 5px}.info{color:#94a3b8;font-weight:800}.score{font-size:1.2rem;font-weight:900;margin:8px}canvas{display:block;width:min(94vw,420px);height:auto;margin:12px auto;background:#0b1220;border:1px solid #334155;border-radius:16px;touch-action:none}.controls{display:flex;justify-content:center;gap:16px}.move{width:110px;padding:15px;border-radius:15px;border:1px solid #33415c;background:#111827;color:#fff;font-size:1.5rem;font-weight:900;touch-action:manipulation}.move:active{transform:scale(.95)}</style></head><body><h1>🧱 ブリックブレイク</h1><div id="info" class="info">バーを左右に動かしてボールを返そう</div><div id="score" class="score">0</div><canvas id="c" width="420" height="560"></canvas><div class="controls"><button class="move" id="left">◀</button><button class="move" id="right">▶</button></div><script src="common.js"></script><script>const c=document.getElementById("c"),ctx=c.getContext("2d"),info=document.getElementById("info"),scoreEl=document.getElementById("score");let px=165,bx=210,by=500,dx=3,dy=-4,score=0,br=[],run=false,raf=0;function reset(){cancelAnimationFrame(raf);px=165;bx=210;by=500;dx=3;dy=-4;score=0;br=[];for(let r=0;r<6;r++)for(let k=0;k<7;k++)br.push({x:10+k*58,y:30+r*30,on:true});scoreEl.textContent=0;info.textContent="バーを左右に動かしてボールを返そう";draw()}function start(){reset();run=true;loop()}function draw(){ctx.clearRect(0,0,420,560);ctx.fillStyle="#1e293b";ctx.fillRect(0,0,420,560);br.forEach(b=>{if(b.on){ctx.fillStyle="#38bdf8";ctx.fillRect(b.x,b.y,54,22)}});ctx.fillStyle="#fff";ctx.fillRect(px,530,90,12);ctx.beginPath();ctx.arc(bx,by,8,0,Math.PI*2);ctx.fill()}function control(v){px=Math.max(5,Math.min(325,px+v))}["left","right"].forEach(id=>{let b=document.getElementById(id),v=id==="left"?-22:22;b.addEventListener("pointerdown",e=>{control(v);b.setPointerCapture?.(e.pointerId)})});c.addEventListener("pointermove",e=>{if(e.buttons){let r=c.getBoundingClientRect();px=Math.max(5,Math.min(325,(e.clientX-r.left)/r.width*420-45))}});function loop(){if(!run)return;bx+=dx;by+=dy;if(bx<8||bx>412){bx=Math.max(8,Math.min(412,bx));dx*=-1}if(by<8){by=8;dy=Math.abs(dy)}if(by>520&&by<550&&bx>px-5&&bx<px+95){dy=-Math.abs(dy);dx=Math.max(-6,Math.min(6,(bx-(px+45))/9))}for(const b of br){if(b.on&&bx+8>b.x&&bx-8<b.x+54&&by+8>b.y&&by-8<b.y+22){b.on=false;score+=10;scoreEl.textContent=score;dy*=-1;break}}if(br.every(b=>!b.on)){run=false;info.textContent="🎉 全ブロック破壊！";draw();GameKit.finish("🎉 全ブロック破壊！ スコア "+score);return}if(by>575){run=false;info.textContent="ゲームオーバー！";draw();GameKit.finish("ゲームオーバー！ スコア "+score);return}draw();raf=requestAnimationFrame(loop)}GameKit.mount({title:"🧱 ブリックブレイク",intro:"下のバーを左右に動かして、ボールでブロックを壊します。",howto:"スマホでは画面下の◀▶ボタンを使うか、ゲーム画面上で指を左右に動かします。ボールを落とすとゲームオーバー。すべてのブロックを壊すとクリアです。",onStart:start,onRestart:start});start();</script></body></html>
