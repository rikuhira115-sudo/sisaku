<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>ハイ＆ロー</title><style>body{margin:0;background:#070a11;color:#fff;font-family:system-ui;text-align:center}h1{margin:25px}.num{font-size:5rem;font-weight:900;margin:45px 0}.choices{display:flex;justify-content:center;gap:12px}.choices button{width:42%;padding:22px;border-radius:18px;border:1px solid #33415c;background:#111827;color:#fff;font-size:1.3rem;font-weight:900}.info{color:#94a3b8}.back{margin:30px;padding:11px 18px;border-radius:12px;border:1px solid #33415c;background:#111827;color:#fff}</style><h1>🔼 ハイ＆ロー</h1><div class="info" id="i">次の数字は大きい？小さい？</div><div class="num" id="n">50</div><div class="choices"><button id="hi">HIGH</button><button id="lo">LOW</button></div><button class="back" onclick="location.href='index.html'">← ゲーム王国</button><script>let n=50,s=0,i=document.getElementById("i"),ne=document.getElementById("n");function play(dir){let x=1+Math.floor(Math.random()*99);let ok=(dir==="h"&&x>=n)||(dir==="l"&&x<=n);n=x;ne.textContent=x;if(ok){s++;i.textContent="正解！ "+s+"連勝";}else{i.textContent="ゲームオーバー！ "+s+"連勝";s=0}navigator.vibrate?.(ok?12:70)}hi.onclick=()=>play("h");lo.onclick=()=>play("l")</script></html>
