<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>リズムタップ</title><style>body{margin:0;background:#05070c;color:#fff;font-family:system-ui;text-align:center}h1{margin:25px}.lane{width:min(92vw,400px);height:420px;margin:15px auto;position:relative;background:#111827;border-radius:18px;overflow:hidden}.note{position:absolute;width:70px;height:22px;border-radius:11px;background:#60a5fa;left:calc(50% - 35px)}.hit{position:absolute;bottom:50px;width:100%;height:70px;border-top:2px solid #fff;border-bottom:2px solid #fff}.tap{width:180px;height:70px;border-radius:20px;background:#1d4ed8;border:0;color:#fff;font-weight:900;font-size:1.4rem}.info{color:#94a3b8}.back{margin:18px;padding:10px 17px;border-radius:12px;background:#111827;border:1px solid #33415c;color:#fff;font-weight:800}</style><h1>🎵 リズムタップ</h1><div class="info" id="i">ノートが線に重なったらTAP!</div><div class="lane" id="l"><div class="hit"></div></div><button class="tap" id="tap">TAP!</button><br><button class="back" onclick="location.href='index.html'">← ゲーム王国</button><script>let l=document.getElementById("l"),tap=document.getElementById("tap"),i=document.getElementById("i"),active=null,score=0;function spawn(){let n=document.createElement("div");n.className="note";n.style.top="-25px";active=n;l.appendChild(n);let t=performance.now();function fall(now){let y=(now-t)*.00035*l.clientHeight-25;n.style.top=y+"px";if(y<l.clientHeight-30)requestAnimationFrame(fall);else{if(n===active)active=null;n.remove()}}requestAnimationFrame(fall)}tap.onclick=()=>{if(!active){i.textContent="MISS";return}let y=parseFloat(active.style.top),line=l.clientHeight-85,d=Math.abs(y-line);active.remove();active=null;if(d<35){score+=d<15?2:1;i.textContent="GOOD!  スコア "+score;navigator.vibrate?.(15)}else{i.textContent="MISS　スコア "+score}};setInterval(spawn,850);</script></html>
