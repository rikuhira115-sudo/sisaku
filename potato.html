 x.clearRect(0,0,1024,256);x.fillStyle="rgba(36,27,18,.93)";x.beginPath();x.roundRect(10,10,1004,236,25);x.fill();x.strokeStyle="#a3875a";x.lineWidth=5;x.stroke();
 x.textAlign="center";x.textBaseline="middle";x.fillStyle="#ead7b2";x.font="bold 58px system-ui,sans-serif";x.fillText(main,512,96,940);x.fillStyle="#c0ad8b";x.font="34px system-ui,sans-serif";x.fillText(sub||"",512,177,940);

function disposeObject(o){o.traverse(n=>{if(n.geometry)n.geometry.dispose();if(n.material){const ms=Array.isArray(n.material)?n.material:[n.material];ms.forEach(m=>{if(m.map)m.map.dispose();m.dispose()})}})}
function makeMiniPotatoAssets(){
 if(miniPotatoGeometry&&miniPotatoMaterial)return;
 const geo=new THREE.SphereGeometry(1,22,14),p=geo.attributes.position;
 for(let i=0;i<p.count;i++){
  const x=p.getX(i),y=p.getY(i),z=p.getZ(i);
  const wave=1+.065*Math.sin(y*3.1)+.035*Math.sin(x*4.2+z*2.5)+.02*Math.sin(z*6.5-y*1.8);
  p.setXYZ(i,x*wave*(1+.045*Math.sin(y*2.2)),y*(.93+.035*Math.sin(x*4)),z*wave);
 }
 geo.computeVertexNormals();miniPotatoGeometry=geo;
 const cv=document.createElement("canvas");cv.width=256;cv.height=128;const x=cv.getContext("2d");
 const grad=x.createLinearGradient(0,0,200,128);grad.addColorStop(0,"#b58a53");grad.addColorStop(.45,"#8e6038");grad.addColorStop(1,"#50331f");x.fillStyle=grad;x.fillRect(0,0,256,128);
 let s=3819;const rr=()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296};
 for(let i=0;i<450;i++){const px=rr()*256,py=rr()*128,r=.25+rr()*1.2;x.beginPath();x.ellipse(px,py,r*1.4,r,rr()*3,0,Math.PI*2);x.fillStyle=rr()>.5?"#4b301d":"#dbb47a";x.globalAlpha=.08+rr()*.13;x.fill()}
 for(let i=0;i<12;i++){const px=rr()*256,py=rr()*128,r=1+rr()*2;x.beginPath();x.ellipse(px,py,r*2,r*1.5,rr(),0,Math.PI*2);x.fillStyle="#c4a06b";x.globalAlpha=.24;x.fill();x.beginPath();x.ellipse(px,py,r,r*.7,rr(),0,Math.PI*2);x.fillStyle="#452b1b";x.globalAlpha=.55;x.fill()}
 x.globalAlpha=1;const tex=new THREE.CanvasTexture(cv);tex.colorSpace=THREE.SRGBColorSpace;tex.anisotropy=1;

}

function burstParticles(pos,palette,count=16,power=1){
 if(!scene)return;
 for(let i=0;i<count;i++){
  const size=.009+Math.random()*.018;
  const geo=new THREE.IcosahedronGeometry(size,0);
  const mat=new THREE.MeshStandardMaterial({color:palette[i%palette.length],roughness:1,transparent:true,opacity:.95,depthWrite:false});
  const mesh=new THREE.Mesh(geo,mat);mesh.position.copy(pos);mesh.rotation.set(Math.random()*6,Math.random()*6,Math.random()*6);scene.add(mesh);
  const angle=Math.random()*Math.PI*2,speed=(.45+Math.random()*1.45)*power;
  particles.push({mesh,vx:Math.cos(angle)*speed,vy:(.45+Math.random()*1.8)*power,vz:(Math.random()-.5)*.7,life:.45+Math.random()*.55,maxLife:.45+Math.random()*.55,spin:(Math.random()-.5)*8});
 }

function showModeMenu(){

 document.getElementById("endPanel").classList.remove("show");

}
function startMode(mode){

 try{
  const key=gameMode==="endless"?"potato3dBestEndless":"potato3dBestTimed";
  best=Number(localStorage.getItem(key)||(gameMode==="timed"?localStorage.getItem("potato3dBest"):"")||0);

 document.getElementById("endPanel").classList.remove("show");

}
function resetGame(){
 ended=false;dragging=false;physics=false;score=0;round=0;gameSeconds=30;elapsedSeconds=0;objectResolved=false;streak=0;bestStreak=0;sortedCount=0;goldCount=0;
 bankedPotatoes.forEach(p=>scene.remove(p));bankedPotatoes=[];
 particles.forEach(p=>{scene.remove(p.mesh);p.mesh.geometry.dispose();p.mesh.material.dispose()});particles=[];
 if(basket){basket.rotation.set(0,0,0);basket.scale.set(1.34,1.10,1.34)}
 if(objectRoot)objectRoot.visible=true;
 nextItem();updateHud();
 showNotice(gameMode==="endless"?"エンドレス開始！":"30秒チャレンジ開始！",gameMode==="endless"?"ミスするまで続けよう":"黄金じゃがいもを狙おう");
}
function init(){
 if(!window.THREE)return;
 grabOffset=new THREE.Vector3();dragPlane=new THREE.Plane(new THREE.Vector3(0,0,1),0);raycaster=new THREE.Raycaster();pointer=new THREE.Vector2();hitPoint=new THREE.Vector3();
 scene=new THREE.Scene();scene.background=new THREE.Color("#282219");scene.fog=new THREE.Fog("#282219",8,18);
 camera=new THREE.PerspectiveCamera(37,1,.1,100);camera.position.set(0,.15,7.2);camera.lookAt(0,-.2,0);
 renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.35));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;renderer.shadowMap.enabled=false;renderer.setClearColor("#282219",1);
 scene.add(new THREE.HemisphereLight("#e6d8bd","#302317",1.8));
 const key=new THREE.DirectionalLight("#fff0d2",2.5);key.position.set(-3,5,5);key.castShadow=false;scene.add(key);
 const fill=new THREE.DirectionalLight("#b8bdc7",.75);fill.position.set(4,1,-4);scene.add(fill);
 const rimLight=new THREE.DirectionalLight("#e5b86e",.7);rimLight.position.set(2,2,4);scene.add(rimLight);
 const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:"#393126",roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-1.68;floor.receiveShadow=true;scene.add(floor);
 const shadowCanvas=document.createElement("canvas");shadowCanvas.width=128;shadowCanvas.height=128;const sc=shadowCanvas.getContext("2d");const sg=sc.createRadialGradient(64,64,4,64,64,62);sg.addColorStop(0,"rgba(0,0,0,.34)");sg.addColorStop(.55,"rgba(0,0,0,.16)");sg.addColorStop(1,"rgba(0,0,0,0)");sc.fillStyle=sg;sc.fillRect(0,0,128,128);const shadowTex=new THREE.CanvasTexture(shadowCanvas);
 basketShadow=new THREE.Mesh(new THREE.PlaneGeometry(1.9,1.1),new THREE.MeshBasicMaterial({map:shadowTex,transparent:true,depthWrite:false,toneMapped:false}));basketShadow.rotation.x=-Math.PI/2;basketShadow.position.set(0,-1.665,.15);scene.add(basketShadow);
 objectShadow=new THREE.Mesh(new THREE.PlaneGeometry(1.1,.7),new THREE.MeshBasicMaterial({map:shadowTex,transparent:true,depthWrite:false,toneMapped:false}));objectShadow.rotation.x=-Math.PI/2;objectShadow.position.set(0,-1.662,.1);scene.add(objectShadow);
 const back=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:"#282219",roughness:1}));back.position.z=-3;scene.add(back);
 basket=makeBasket();basket.scale.set(1.34,1.10,1.34);basket.position.y=.10;scene.add(basket);
 objectRoot=new THREE.Group();scene.add(objectRoot);
 ready=true;velocity=new THREE.Vector3();resize();updateHud();lastFrame=performance.now();animate();
}
function resize(){if(!renderer||!camera)return;const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
function nextItem(){
 if(objectMesh){objectRoot.remove(objectMesh);objectMesh.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){if(Array.isArray(o.material))o.material.forEach(m=>{if(m.map)m.map.dispose();m.dispose()});else{if(o.material.map)o.material.map.dispose();o.material.dispose()}}})}
 round++;objectRoot.rotation.set(0,0,0);
 if(goldGlowSprite){objectRoot.remove(goldGlowSprite);goldGlowSprite.material.dispose();goldGlowSprite=null}
 const r=rng(round*9137+Math.floor(Math.random()*99999));const isPotato=r()>.25, rockStyle=isPotato?"potato":(["potatoLike","angular","layered"][Math.floor(r()*3)]), dirt=isPotato?.22+r()*.58:rockStyle==="potatoLike"?.22+r()*.48:.55+r()*.45,seed=Math.floor(r()*999999),golden=isPotato&&r()>.93;
 current={potato:isPotato,weight:isPotato?Math.round(55+r()*440):0,dirt,rockStyle,golden};
 objectMesh=createSpecimen(seed,isPotato?"potato":"rock",dirt,isPotato&&r()>.82,rockStyle);objectRoot.add(objectMesh);objectRoot.position.set((r()-.5)*.9,.86+(r()-.5)*.22,.1);objectRoot.scale.setScalar(.53+r()*.10);velocity.set(0,0,0);physics=false;objectResolved=false;ended=false;
 if(golden&&objectMesh.children[0]&&objectMesh.children[0].material){
  const gm=objectMesh.children[0].material;gm.color.set("#fff0ac");gm.emissive=new THREE.Color("#ffb900");gm.emissiveIntensity=3.2;gm.roughness=.3;
  if(!goldGlowTexture){const cv=document.createElement("canvas");cv.width=128;cv.height=128;const gx=cv.getContext("2d"),gr=gx.createRadialGradient(64,64,2,64,64,63);gr.addColorStop(0,"rgba(255,255,220,1)");gr.addColorStop(.16,"rgba(255,240,90,.95)");gr.addColorStop(.38,"rgba(255,184,20,.58)");gr.addColorStop(.7,"rgba(255,139,0,.16)");gr.addColorStop(1,"rgba(255,130,0,0)");gx.fillStyle=gr;gx.fillRect(0,0,128,128);goldGlowTexture=new THREE.CanvasTexture(cv);goldGlowTexture.colorSpace=THREE.SRGBColorSpace}
  goldGlowSprite=new THREE.Sprite(new THREE.SpriteMaterial({map:goldGlowTexture,transparent:true,opacity:.96,blending:THREE.AdditiveBlending,depthTest:false,depthWrite:false,toneMapped:false}));
  goldGlowSprite.scale.set(2.0,2.0,1);goldGlowSprite.position.set(0,0,.1);goldGlowSprite.renderOrder=4;objectRoot.add(goldGlowSprite);
  burstParticles(objectRoot.position,["#fff5ae","#ffdf39","#ffac00"],10,.45);showNotice("✨ 黄金じゃがいも！","強烈に輝くお宝！カゴへ急げ");
 }
}
function pointerToPlane(e){pointer.x=e.clientX/innerWidth*2-1;pointer.y=-(e.clientY/innerHeight)*2+1;raycaster.setFromCamera(pointer,camera);return raycaster.ray.intersectPlane(dragPlane,hitPoint)}
function recordSuccess(){streak++;sortedCount++;bestStreak=Math.max(bestStreak,streak);updateHud()}
function updateHud(){
 document.getElementById("scoreText").textContent="¥"+score.toLocaleString("ja-JP");document.getElementById("countText").textContent=String(bankedPotatoes.length);
 const timeLabel=document.getElementById("timeLabel"),track=document.getElementById("timeTrack");
 if(gameMode==="endless"){
  timeLabel.textContent="経過時間";document.getElementById("timeText").textContent=Math.floor(elapsedSeconds)+"秒";
  track.style.display="none";
 }else{
  timeLabel.textContent="残り時間";document.getElementById("timeText").textContent=Math.max(0,gameSeconds).toFixed(1)+"秒";
  track.style.display="block";document.getElementById("timeFill").style.width=(Math.max(0,gameSeconds)/30*100)+"%";
  document.getElementById("timeFill").classList.toggle("urgent",gameSeconds<=5);
 }
 const combo=document.getElementById("comboText");combo.textContent="連続成功 "+streak+"回";combo.classList.toggle("hot",streak>=3);
}
function onDown(e){
 if(!ready||ended||physics)return;
 pointerToPlane(e);
 const hits=raycaster.intersectObject(objectMesh,true);if(!hits.length)return;
 dragging=true;physics=false;velocity.set(0,0,0);lastTime=performance.now();
 try{canvas.setPointerCapture(e.pointerId)}catch(_){}
 canvas.style.cursor="grabbing";grabOffset.copy(objectRoot.position).sub(hitPoint);
}
function onMove(e){
 if(!dragging)return;
 const now=performance.now(),dt=Math.max(.008,(now-lastTime)/1000),prev=objectRoot.position.clone();
 if(pointerToPlane(e)){
  objectRoot.position.x=clamp(hitPoint.x+grabOffset.x,-3.0,3.0);
  objectRoot.position.y=clamp(hitPoint.y+grabOffset.y,-1.45,2.2);
  velocity.set((objectRoot.position.x-prev.x)/dt,(objectRoot.position.y-prev.y)/dt,0);
  velocity.clampLength(0,7.5);
 }
 lastTime=now;
}
function gameOver(message){
 if(ended)return;
 ended=true;dragging=false;physics=false;canvas.style.cursor="grab";
 if(score>best){best=score;try{const key=gameMode==="endless"?"potato3dBestEndless":"potato3dBestTimed";localStorage.setItem(key,String(best));localStorage.setItem("potato3dBest",String(Math.max(best,Number(localStorage.getItem("potato3dBest")||0))))}catch(_){}}
 document.getElementById("endTitle").textContent=gameMode==="timed"&&gameSeconds<=0?"タイムアップ！":gameMode==="endless"?"エンドレス終了！":"鑑定終了！";
 document.getElementById("endScore").textContent="¥"+score.toLocaleString("ja-JP");
 const rank=score>=2400?"伝説の芋王":score>=1600?"黄金の鑑定士":score>=950?"畑のエース":score>=450?"一人前の鑑定士":"見習い鑑定士";
 document.getElementById("endRank").textContent=rank;
 document.getElementById("endMeta").innerHTML='<div class="endrow"><span>モード</span><strong>'+(gameMode==="endless"?"エンドレス":"30秒チャレンジ")+'</strong></div><div class="endrow"><span>今回の売上</span><strong>¥'+score.toLocaleString("ja-JP")+'</strong></div><div class="endrow"><span>このモードの自己ベスト</span><strong>¥'+best.toLocaleString("ja-JP")+'</strong></div><div class="endrow"><span>カゴに入れた数</span><strong>'+bankedPotatoes.length+' 個</strong></div><div class="endrow"><span>正しい仕分け</span><strong>'+sortedCount+' 回</strong></div><div class="endrow"><span>最大連続成功</span><strong>'+bestStreak+' 回</strong></div><div class="endrow"><span>黄金じゃがいも</span><strong>'+goldCount+' 個</strong></div><div class="endrow"><span>終了理由</span><strong>'+message+'</strong></div>';
 document.getElementById("endPanel").classList.add("show");

}
function onUp(){
 if(!dragging)return;
 dragging=false;canvas.style.cursor="grab";
 // Preserve the movement speed at release; gravity and drag continue moving the specimen.
 velocity.multiplyScalar(.88);velocity.clampLength(0,7.5);physics=true;lastFrame=performance.now();
}
function resolveObject(inBasket){
 if(objectResolved||ended)return;
 objectResolved=true;physics=false;
 if(inBasket){
  if(current.potato){
   recordSuccess();const basePrice=Math.round(current.weight*.5),goldFactor=current.golden?3:1,price=Math.round(basePrice*goldFactor);score+=price;if(current.golden)goldCount++;addPotatoToBasket();updateHud();basketPulse=1;
   burstParticles(new THREE.Vector3(objectRoot.position.x,-.78,.35),current.golden?["#fff0a8","#f4c54c","#a17a25"]:["#ead08a","#cfaa62","#a17a49","#745337"],current.golden?22:12,current.golden?1.25:1.0);
   showNotice((current.golden?"GOLD! ":"")+"+¥"+price.toLocaleString("ja-JP"),"売上 ¥"+score.toLocaleString("ja-JP")+" · "+streak+"連続成功");
   setTimeout(()=>{if(!ended)nextItem()},300);
  }else{burstParticles(objectRoot.position,["#bd7752","#74432c","#d1a66a"],8,.8);gameOver("石をカゴに入れてしまった！")}
 }else{
  if(current.potato){burstParticles(objectRoot.position,["#a55b3f","#75402c","#d4a265"],7,.8);gameOver("じゃがいもを落としてしまった！")}
  else{recordSuccess();burstParticles(objectRoot.position,["#715c43","#947b59","#c5a779"],7,.75);showNotice("石を見抜いた！","連続成功 "+streak+"回");setTimeout(()=>{if(!ended)nextItem()},260)}
 }
}
function animate(){
 requestAnimationFrame(animate);if(!renderer)return;
 const now=performance.now(),dt=Math.min(.04,(now-lastFrame)/1000||0);lastFrame=now;
 if(started&&!ended){
  if(gameMode==="timed"){gameSeconds=Math.max(0,gameSeconds-dt);if(gameSeconds<=0)gameOver("制限時間終了！")}
  else elapsedSeconds+=dt;
  updateHud();
 }
 if(started&&objectRoot&&!dragging&&!ended){
  if(physics){
   velocity.y-=4.8*dt;objectRoot.position.addScaledVector(velocity,dt);objectRoot.rotation.x+=velocity.y*dt*.12;objectRoot.rotation.z-=velocity.x*dt*.10;
   velocity.multiplyScalar(Math.pow(.985,dt*60));
   // The enlarged basket catches a downward-moving item crossing its opening.
   const inBasket=Math.abs(objectRoot.position.x)<.91&&objectRoot.position.y<-.73&&objectRoot.position.y> -1.42&&velocity.y<0;
   if(inBasket){resolveObject(true)}
   else if(objectRoot.position.y< -1.16){
    objectRoot.position.y=-1.16;
    if(Math.abs(velocity.y)>.8&&Math.abs(velocity.x)<2.2){velocity.y=Math.abs(velocity.y)*.20;velocity.x*=.55}
    else resolveObject(false);
   }else if(Math.abs(objectRoot.position.x)>3.25||objectRoot.position.y>2.8)resolveObject(false);
  }else{const t=now*.001;objectRoot.position.y+=Math.sin(t*1.3+round)*.0008;objectRoot.rotation.y+=dt*.18;objectRoot.rotation.z=Math.sin(t*.6+round)*.012}
 }
 // Small soil / golden flecks fade out quickly, keeping effects inexpensive on mobile.
 for(let i=particles.length-1;i>=0;i--){
  const p=particles[i];p.life-=dt;p.mesh.position.x+=p.vx*dt;p.mesh.position.y+=p.vy*dt;p.mesh.position.z+=p.vz*dt;
  p.vy-=2.6*dt;p.mesh.rotation.x+=p.spin*dt;p.mesh.rotation.y+=p.spin*.7*dt;
  p.mesh.material.opacity=Math.max(0,p.life/p.maxLife);
  if(p.life<=0){scene.remove(p.mesh);p.mesh.geometry.dispose();p.mesh.material.dispose();particles.splice(i,1)}
 }
 if(basket){
  basketPulse=Math.max(0,basketPulse-dt*2.8);
  const pulse=Math.sin(basketPulse*Math.PI)*.055;
  basket.scale.set(1.34*(1+pulse),1.10*(1+pulse*1.5),1.34*(1+pulse));
 }
 if(started&&objectShadow&&objectRoot&&!ended){objectShadow.position.x=objectRoot.position.x*.88;const altitude=clamp((objectRoot.position.y+1.1)/2.3,0,1);objectShadow.material.opacity=.28-altitude*.19;objectShadow.scale.setScalar(1+altitude*.85);}
 if(goldGlowSprite&&goldGlowSprite.parent){const pulse=1+.11*Math.sin(now*.009);goldGlowSprite.scale.set(2.0*pulse,2.0*pulse,1);goldGlowSprite.material.opacity=.73+.24*(.5+.5*Math.sin(now*.012));}
 renderer.render(scene,camera);
}
canvas.addEventListener("pointerdown",onDown);canvas.addEventListener("pointermove",onMove);canvas.addEventListener("pointerup",onUp);canvas.addEventListener("pointercancel",()=>{if(dragging){dragging=false;physics=true;lastFrame=performance.now()}canvas.style.cursor="grab"});window.addEventListener("resize",resize);
document.getElementById("timedModeBtn").addEventListener("click",()=>startMode("timed"));
document.getElementById("endlessModeBtn").addEventListener("click",()=>startMode("endless"));
document.getElementById("restartBtn").addEventListener("click",()=>{document.getElementById("endPanel").classList.remove("show");started=true;resetGame();updateHud()});

window.loadThreeLibrary(ok=>{if(!ok){showFatal("3Dエンジンを読み込めませんでした。ネット接続を確認して再読み込みしてください。");return}try{init()}catch(err){console.error(err);showFatal("3D表示を開始できませんでした。ブラウザを再読み込みしてみてください。")}})
})();
