<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#211b14"><title>じゃがいも鑑定士 | ゲーム王国</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#211b14;touch-action:none}body{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}
</style>
</head>
<body>
<canvas id="world" aria-label="3D空間で対象をつかんでバスケットに仕分ける"></canvas>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(()=>{
const canvas=document.getElementById("world");
let renderer,scene,camera,objectRoot,objectMesh,basket,ready=false,dragging=false,ended=false,score=0,round=0,current=null,grabOffset=new THREE.Vector3(),dragPlane=new THREE.Plane(new THREE.Vector3(0,0,1),0),raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2(),hitPoint=new THREE.Vector3(),lastTime=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function skinTexture(seed,kind,dirt){
 const r=rng(seed),c=document.createElement("canvas");c.width=1024;c.height=512;const x=c.getContext("2d");
 const base=kind==="rock"?"#77705e":"#98774d";x.fillStyle=base;x.fillRect(0,0,1024,512);
 for(let i=0;i<260;i++){const px=r()*1024,py=r()*512,rx=8+r()*75,ry=4+r()*28;x.beginPath();x.ellipse(px,py,rx,ry,r()*Math.PI,0,Math.PI*2);x.fillStyle=r()>.5?"#d2b58a":"#473421";x.globalAlpha=.025+r()*.075;x.fill()}
 const g=x.createLinearGradient(0,0,850,512);g.addColorStop(0,"#c4a477");g.addColorStop(.25,base);g.addColorStop(.7,kind==="rock"?"#625b4b":"#6e5030");g.addColorStop(1,"#3c3022");x.globalAlpha=.5;x.fillStyle=g;x.fillRect(0,0,1024,512);x.globalAlpha=1;
 for(let i=0;i<4300;i++){const px=r()*1024,py=r()*512,rr=.25+r()*1.4;x.beginPath();x.ellipse(px,py,rr*(.6+r()),rr,r()*Math.PI,0,Math.PI*2);x.fillStyle=r()>.5?"#30261b":"#dfc59a";x.globalAlpha=.06+r()*.2;x.fill()}
 if(kind==="potato"){
  // Characteristic potato eyes: dark, shallow pits with a pale raised edge.
  for(let i=0;i<42;i++){const px=r()*1024,py=r()*512,rx=2+r()*5,ry=1.5+r()*3.5;x.beginPath();x.ellipse(px,py,rx*1.8,ry*1.7,r()*.8,0,Math.PI*2);x.fillStyle="#d2b78f";x.globalAlpha=.35;x.fill();x.beginPath();x.ellipse(px,py,rx,ry,r()*.8,0,Math.PI*2);x.fillStyle="#382719";x.globalAlpha=.55;x.fill();x.beginPath();x.ellipse(px-rx*.15,py-ry*.2,rx*.4,ry*.3,0,0,Math.PI*2);x.fillStyle="#17120d";x.globalAlpha=.45;x.fill()}
 }
 // Soil patches are especially thick on stones, disguising their grey-brown rock beneath.
 if(dirt>0){for(let i=0;i<Math.floor(760*dirt);i++){const px=r()*1024,py=r()*512,rr=2+r()*17;x.beginPath();x.ellipse(px,py,rr*(.6+r()*1.7),rr*(.25+r()*.8),r()*Math.PI,0,Math.PI*2);x.fillStyle=r()>.45?"#34271b":"#60482d";x.globalAlpha=(.07+r()*.32)*dirt;x.fill()}}
 x.globalAlpha=1;const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;return t;
}
function createSpecimen(seed,kind,dirt,sprout){
 const r=rng(seed),g=new THREE.SphereGeometry(1,112,80),p=g.attributes.position;
 const eyes=[];
 if(kind==="potato")for(let k=0;k<15;k++){const a=r()*Math.PI*2,b=(r()-.5)*Math.PI;eyes.push({x:Math.cos(b)*Math.cos(a),y:Math.sin(b),z:Math.cos(b)*Math.sin(a),size:.035+r()*.045,depth:.018+r()*.035})}
 for(let i=0;i<p.count;i++){
  const x=p.getX(i),y=p.getY(i),z=p.getZ(i);
  let wave=Math.sin(x*5.4+seed*.013)*Math.sin(y*4.7+seed*.009)*.045+Math.sin(z*8.3+x*3.1+seed*.02)*.026+Math.sin(y*11.7-z*4.2+seed*.01)*.012;
  let dent=0;for(const e of eyes){const dx=x-e.x,dy=y-e.y,dz=z-e.z,d=Math.sqrt(dx*dx+dy*dy+dz*dz);dent+=e.depth*Math.exp(-(d*d)/(e.size*e.size*1.5))}
  let n=1+wave-dent+(r()-.5)*.008,xx=x*n,yy=y*n,zz=z*n;
  if(kind==="rock"){n=1+Math.sin(x*4.4+seed*.01)*Math.sin(y*5.3+z*2.2)*.075+Math.sin(z*7.5+x*4.7+seed*.03)*.05;xx=x*n+.035*Math.sin(y*7+seed);yy=y*n+.03*Math.sin(x*8+seed);zz=z*n}
  else {const shoulder=1+.105*Math.sin(y*2.8+seed*.004)+.045*Math.sin(x*4.5+z*2.3+seed*.01);xx*=shoulder*(1+.045*Math.sin(y*5.2+seed*.02));yy*=.88+.045*Math.sin(x*4.1+seed*.01)+.025*Math.sin(z*7.2+seed*.02);zz*=.92+.055*Math.sin(y*4.2+x*2.3+seed*.01);xx+=.045*Math.sin(y*3.1+seed*.02)}
  p.setXYZ(i,xx,yy,zz)
 }
 g.computeVertexNormals();
 const group=new THREE.Group(),tex=skinTexture(seed,kind,dirt),mat=new THREE.MeshStandardMaterial({map:tex,roughness:.94,metalness:0});
 const mesh=new THREE.Mesh(g,mat);mesh.scale.set(kind==="rock"?.9:1.02,kind==="rock"?.83:.96,kind==="rock"?.88:.95);mesh.rotation.set(.14,(r()-.5)*.25,(r()-.5)*.35);mesh.castShadow=true;mesh.receiveShadow=true;group.add(mesh);
 // Soil grains and small clods sit on top of the skin rather than reading as colour alone.
 const soilMat=new THREE.MeshStandardMaterial({color:"#4a3825",roughness:1});
 for(let i=0;i<Math.floor(dirt*48);i++){const a=r()*Math.PI*2,b=(r()-.5)*Math.PI,rad=kind==="rock"?.91:1.01,rr=.009+r()*.026,clod=new THREE.Mesh(new THREE.IcosahedronGeometry(rr,1),soilMat);clod.position.set(Math.cos(b)*Math.cos(a)*rad,Math.sin(b)*rad,Math.cos(b)*Math.sin(a)*rad);clod.scale.set(1.25,.7,.8);clod.castShadow=true;group.add(clod)}
 if(sprout){const sm=new THREE.MeshStandardMaterial({color:"#667044",roughness:.9});const stem=new THREE.Mesh(new THREE.ConeGeometry(.045,.16,7),sm);stem.position.set(.08,.91,.08);stem.rotation.z=-.45;stem.castShadow=true;group.add(stem)}
 return group;
}
function makeBasket(){
 const group=new THREE.Group(),dark=new THREE.MeshStandardMaterial({color:"#49321e",roughness:.94}),light=new THREE.MeshStandardMaterial({color:"#8c6840",roughness:.9}),mid=new THREE.MeshStandardMaterial({color:"#6f4e2e",roughness:.94});
 // Open basket body: tapered wicker wall with visible interior.
 const shape=new THREE.Shape();shape.moveTo(-.78,-.3);shape.lineTo(.78,-.3);shape.lineTo(.58,.36);shape.lineTo(-.58,.36);shape.close();
 const geo=new THREE.ExtrudeGeometry(shape,{depth:.62,bevelEnabled:true,bevelSegments:3,steps:1,bevelSize:.035,bevelThickness:.035});
 const body=new THREE.Mesh(geo,dark);body.rotation.x=Math.PI/2;body.position.set(0,-1.22,-.12);body.castShadow=true;body.receiveShadow=true;group.add(body);
 // The opening is a shallow dark ellipse, with rim and crossing wicker strips.
 const inside=new THREE.Mesh(new THREE.CylinderGeometry(.59,.48,.035,48,1,true),new THREE.MeshStandardMaterial({color:"#21170f",side:THREE.DoubleSide,roughness:1}));inside.rotation.x=Math.PI/2;inside.position.set(0,-.88,.16);group.add(inside);
 const rim=new THREE.Mesh(new THREE.TorusGeometry(.63,.055,10,64),light);rim.position.set(0,-.88,.16);group.add(rim);
 for(let j=0;j<7;j++){const y=-1.35+j*.075;const rad=.55+(j/6)*.12;const ring=new THREE.Mesh(new THREE.TorusGeometry(rad,.018,5,64),j%2?light:mid);ring.position.set(0,y,.16);group.add(ring)}
 for(let i=0;i<18;i++){const a=i/18*Math.PI*2;const strip=new THREE.Mesh(new THREE.CylinderGeometry(.018,.024,.68,6),i%2?light:mid);strip.position.set(Math.cos(a)*.56,-1.22,Math.sin(a)*.32+.16);strip.rotation.z=Math.cos(a)*.08;strip.rotation.x=Math.sin(a)*.14;group.add(strip)}
 // Basket base and inside bed.
 const base=new THREE.Mesh(new THREE.CylinderGeometry(.53,.46,.09,40),dark);base.position.set(0,-1.52,.16);group.add(base);
 return group;
}
function init(){
 if(!window.THREE)return;
 scene=new THREE.Scene();scene.background=new THREE.Color("#282219");scene.fog=new THREE.Fog("#282219",8,18);
 camera=new THREE.PerspectiveCamera(37,1,.1,100);camera.position.set(0,.15,7.2);camera.lookAt(0,-.2,0);
 renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 scene.add(new THREE.HemisphereLight("#e6d8bd","#302317",2.15));
 const key=new THREE.DirectionalLight("#fff0d2",3.2);key.position.set(-3,5,5);key.castShadow=true;scene.add(key);
 const fill=new THREE.DirectionalLight("#b8bdc7",.85);fill.position.set(4,1,-4);scene.add(fill);
 const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:"#393126",roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-1.68;floor.receiveShadow=true;scene.add(floor);
 const back=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:"#282219",roughness:1}));back.position.z=-3;scene.add(back);
 basket=makeBasket();scene.add(basket);
 objectRoot=new THREE.Group();scene.add(objectRoot);
 ready=true;resize();nextItem();animate();
}
function resize(){if(!renderer||!camera)return;const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
function nextItem(){
 if(objectMesh){objectRoot.remove(objectMesh);objectMesh.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){if(Array.isArray(o.material))o.material.forEach(m=>{if(m.map)m.map.dispose();m.dispose()});else{if(o.material.map)o.material.map.dispose();o.material.dispose()}}})}
 round++;const r=rng(round*9137+Math.floor(Math.random()*99999));const isPotato=r()>.43, dirt=isPotato?.22+r()*.58:.6+r()*.4,seed=Math.floor(r()*999999);
 current={potato:isPotato,weight:isPotato?Math.round(55+r()*440):0,dirt};
 objectMesh=createSpecimen(seed,isPotato?"potato":"rock",dirt,isPotato&&r()>.82);objectRoot.add(objectMesh);objectRoot.position.set((r()-.5)*1.1,.58+(r()-.5)*.42,.1);objectRoot.scale.setScalar(.68+r()*.18);ended=false;
}
function pointerToPlane(e){pointer.x=e.clientX/innerWidth*2-1;pointer.y=-(e.clientY/innerHeight)*2+1;raycaster.setFromCamera(pointer,camera);return raycaster.ray.intersectPlane(dragPlane,hitPoint)}
function onDown(e){if(!ready||ended)return;pointerToPlane(e);const hits=raycaster.intersectObject(objectMesh,true);if(!hits.length)return;dragging=true;lastTime=performance.now();canvas.setPointerCapture(e.pointerId);canvas.style.cursor="grabbing";grabOffset.copy(objectRoot.position).sub(hitPoint)}
function onMove(e){if(!dragging)return;if(pointerToPlane(e)){objectRoot.position.x=hitPoint.x+grabOffset.x;objectRoot.position.y=hitPoint.y+grabOffset.y;objectRoot.position.x=clamp(objectRoot.position.x,-3.1,3.1);objectRoot.position.y=clamp(objectRoot.position.y,-1.25,2.5)}}
function onUp(){if(!dragging)return;dragging=false;canvas.style.cursor="grab";
 // Drop into the open basket: potatoes score and continue; a stone ends the run.
 const inBasket=Math.abs(objectRoot.position.x)<.78&&objectRoot.position.y<-.43&&objectRoot.position.y>-1.55;
 if(inBasket){if(current.potato){score+=Math.round(current.weight*.5);basket.scale.set(1.04,1.02,1.04);setTimeout(()=>{if(basket)basket.scale.set(1,1,1)},130);nextItem()}else{ended=true;objectRoot.visible=false;basket.rotation.z=.035;setTimeout(()=>{basket.rotation.z=0},160)}}else{
   // Releasing a potato outside the basket or a stone away from it means it was discarded.
   if(current.potato){ended=true;objectRoot.visible=false;}else nextItem();
 }
}
function animate(){requestAnimationFrame(animate);if(!renderer)return;const t=performance.now()*.001;if(objectRoot&&!dragging&&!ended){objectRoot.position.y+=Math.sin(t*1.3+round)*.0008;objectRoot.rotation.y=Math.sin(t*.7+round)*.035}renderer.render(scene,camera)}
canvas.addEventListener("pointerdown",onDown);canvas.addEventListener("pointermove",onMove);canvas.addEventListener("pointerup",onUp);canvas.addEventListener("pointercancel",()=>{dragging=false;canvas.style.cursor="grab"});window.addEventListener("resize",resize);
init();if(!ready){const retry=setInterval(()=>{if(window.THREE){clearInterval(retry);init()}},200)}
})();
</script>
</body></html>
